<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 模型库</title>
<style>
  :root{
    /* 鸿蒙配色：深色基底 + 多彩光影 + 柔和渐变 */
    --bg:#050508; --bg-2:#0a0c14; --card:#0c0f18; --card-hover:#11141e;
    --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12);
    --text:#f0f2f5; --muted:#8a90a0; --accent:#00E676;
    --accent-2:#00BCD4; --danger:#e8403a; --ok:#00E676;
    /* 鸿蒙圆角：大圆角为主 */
    --r-sm:12px; --r-md:20px; --r-lg:28px; --r-pill:999px;
    /* 光影：柔和外发光 + 内高光 */
    --shadow-sm:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3),0 0 12px rgba(0,230,118,.06);
    --shadow-md:0 4px 20px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3),0 0 20px rgba(0,230,118,.08);
    --shadow-lg:0 12px 40px rgba(0,0,0,.6),0 4px 16px rgba(0,0,0,.4),0 0 40px rgba(0,230,118,.12);
    --glow-accent:0 0 30px rgba(0,230,118,.35),0 0 60px rgba(0,188,212,.18);
    --glass:rgba(10,12,18,.65);
    --glass-strong:rgba(10,12,18,.85);
    /* 卡片透明毛玻璃：半透明玻璃底（适中，不过透），backdrop-filter 模糊透出背景流光 */
    --glass-card:rgba(10,12,18,.55);
    --glass-card-hover:rgba(10,12,18,.75);
    /* 鸿蒙6 真实毛玻璃：多层折射材质（噪点底纹+边缘高光+内部折射+色温偏移） */
    --glass-blur:blur(20px) saturate(1.5);
    --glass-blur-strong:blur(32px) saturate(1.8);
    /* 模拟毛玻璃内部折射：半透明色温偏移叠加层（增强，玻璃质感更明显） */
    --glass-refraction:linear-gradient(135deg,rgba(0,188,212,.10),rgba(0,230,118,.05));
    /* 模拟毛玻璃边缘高光：1px 内描边（增强，玻璃边缘更亮） */
    --glass-edge:inset 0 1px 1px rgba(255,255,255,.30),inset 0 -1px 1px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,230,118,.08);
    /* 玻璃厚度阴影：克制的小偏移多层半透明浅蓝白（偏移过大会在 rotateY 侧对时于平面产生不贴合怪异影子） */
    --glass-thickness:
      4px 0 0 -2px rgba(180,255,210,.38),
      7px 0 0 -3px rgba(180,255,210,.22),
      10px 0 0 -4px rgba(180,255,210,.10),
      -4px 0 0 -2px rgba(180,255,210,.38),
      -7px 0 0 -3px rgba(180,255,210,.22),
      -10px 0 0 -4px rgba(180,255,210,.10),
      0 5px 0 -2px rgba(180,255,210,.30),
      0 8px 0 -4px rgba(180,255,210,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:"HarmonyOS Sans SC","HarmonyOS Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;
    display:flex;flex-direction:column;min-height:100vh;
    -webkit-font-smoothing:antialiased;
    /* 鸿蒙流光背景：多色彩光晕渐变 */
    background-image:
      radial-gradient(ellipse 80% 50% at 20% 0%,rgba(0,230,118,.06),transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 10%,rgba(0,188,212,.04),transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%,rgba(0,230,118,.04),transparent 60%);
    background-attachment:fixed;
  }
  #app{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

  /* ===== 顶栏（鸿蒙6 真实毛玻璃：多层折射） ===== */
  .topbar{
    display:flex;align-items:center;gap:16px;padding:14px 24px;
    background:var(--glass);background-image:var(--glass-refraction);
    border-bottom:1px solid var(--border);
    height:64px;flex-shrink:0;
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-edge),0 4px 24px rgba(0,0,0,.3);
    position:relative;z-index:10;
  }
  .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
  .logo-icon{
    width:36px;height:36px;border-radius:var(--r-sm);
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--glow-accent),inset 0 1px 1px rgba(255,255,255,.25);
  }
  .logo-icon svg{width:22px;height:22px;color:#fff}
  .search-wrap{flex:1;max-width:480px;position:relative}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
  .search-input{
    width:100%;padding:11px 14px 11px 42px;
    background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);
    color:var(--text);font-size:14px;transition:all .25s;
    backdrop-filter:blur(10px);
  }
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,230,118,.15),var(--glow-accent);
  }
  .filter-select{
    padding:10px 14px;background:var(--glass);border:1px solid var(--border);
    border-radius:var(--r-pill);color:var(--text);font-size:13px;cursor:pointer;
    backdrop-filter:blur(10px);transition:all .2s;
  }
  .filter-select:hover{border-color:var(--border-strong)}
  .filter-select option{background:var(--card);color:var(--text)}
  .topbar-spacer{flex:1}
  .topbar-btn{
    padding:10px 20px;font-size:14px;cursor:pointer;
    border:none;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:var(--r-pill);letter-spacing:.2px;
  }
  .btn-accent{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;box-shadow:var(--glow-accent),inset 0 1px 1px rgba(255,255,255,.2);
  }
  .btn-accent:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 0 32px rgba(0,230,118,.4),inset 0 1px 1px rgba(255,255,255,.3)}
  .btn-accent:active{transform:translateY(0) scale(1)}
  .btn-ghost{
    background:var(--glass);color:var(--text);border:1px solid var(--border);
    backdrop-filter:blur(10px);
  }
  .btn-ghost:hover{background:var(--card-hover);border-color:var(--border-strong);transform:translateY(-1px)}
  .btn-ghost:active{transform:translateY(0)}
  .btn-danger{
    background:linear-gradient(135deg,rgba(232,64,58,.15),rgba(232,64,58,.05));
    color:var(--danger);border:1px solid rgba(232,64,58,.3);
  }
  .btn-danger:hover{background:rgba(232,64,58,.15);box-shadow:0 0 16px rgba(232,64,58,.25)}

  /* ===== 列表区（鸿蒙卡片） ===== */
  .content{flex:1;overflow-y:auto;padding:32px 28px}
  .content-header{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:24px;flex-wrap:wrap;gap:8px;
  }
  .content-title{font-size:26px;font-weight:600;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--text),var(--muted));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .content-meta{color:var(--muted);font-size:13px}

  /* 抽屉平铺堆叠：档案一张张平铺叠放在抽屉里（每张往下沉一点+缩扁一点+半透一点），hover抽出 */
  .drawer{
    position:relative;padding:40px 24px 60px;min-height:420px;
    perspective:1400px;                    /* 恢复空间透视感：侧对卡片有深度立体感，透视设在容器统一所有卡相对深度一致 */
  }
  .drawer::before{                       /* 抽屉底板（虚化层，非实体抽屉） */
    content:'';position:absolute;inset:24px 16px 16px;
    background:linear-gradient(180deg,rgba(0,188,212,.06),transparent 70%);
    border-radius:var(--r-lg);pointer-events:none;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.08);
  }
  /* 横向堆叠容器：一摞立着的卡片横向压着叠，所有卡绝对定位横向往右错位只露一小条 */
  .stack{
    position:relative;height:320px;margin:24px auto;padding:20px 10px;
    transform-style:preserve-3d;          /* 透传3D透视，侧对卡片有深度立体感，透视设在容器统一所有卡相对深度一致 */
  }
  /* 书脊侧对态：每卡 rotateY 转侧对，书脊侧边正对我（封面侧对错开看不到），只露书脊侧面，hover 抽出转正封面朝我 */
  .card{
    position:absolute;left:50%;bottom:0;width:180px;
    --stack-x:0px; --stack-y:0px; --stack-y-extra:330px; --stack-s:1; --stack-o:1; --stack-ry:78deg;
    transform:translateX(var(--stack-x)) translateY(calc(var(--stack-y) + var(--stack-y-extra))) scale(var(--stack-s)) rotateY(var(--stack-ry));
    opacity:var(--stack-o);
    transform-origin:center bottom;        /* 从底轴倾斜，所有卡底边对齐同一条水平线，倾斜不下沉 */
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .35s,box-shadow .35s;
    will-change:transform,opacity;
    box-shadow:
      4px 0 0 -2px rgba(0,0,0,.42),          /* 书脊右侧厚边：模拟书侧面厚度露在外面 */
      7px 0 0 -3px rgba(0,0,0,.26),
      10px 0 0 -4px rgba(0,0,0,.14),
      -4px 0 0 -2px rgba(0,0,0,.42),         /* 书脊左侧厚边：对称厚度感 */
      -7px 0 0 -3px rgba(0,0,0,.26),
      -10px 0 0 -4px rgba(0,0,0,.14),
      0 6px 0 -2px rgba(0,0,0,.3),           /* 底厚边：书底厚度，立体感 */
      var(--glass-edge),var(--shadow-sm);
  }
  .card{
    background:var(--glass-card);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-md);
    cursor:pointer;overflow:hidden;
    /* 鸠蒙6 官方动效规范：
       - 跟手悬停（springMotion 物理弹簧）：用高阻尼弹性贝塞尔模拟，进入快响应、打断即继承速度不黏滞
       - box-shadow/background 用稍慢缓出，从容收回 */
    transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s cubic-bezier(.22,.61,.36,1),background .3s,border-color .3s;
    display:flex;flex-direction:column;position:relative;
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    background-image:var(--glass-refraction);   /* 单层折射渐变，去除噪点纹理避免显脏 */
    /* 玻璃厚度：左右+底部多层半透明浅蓝白偏移，侧对时呈玻璃板侧面厚度感（覆盖第一块里从未生效的黑色厚边） */
    box-shadow:
      var(--glass-thickness),
      var(--glass-edge),var(--shadow-sm);
  }
  /* 玻璃高光层（默认可见，克制自然）：单条顶部受光带 + 一条斜向反光，hover 时稍增强 */
  .card::before{
    content:'';position:absolute;inset:0;border-radius:var(--r-md);
    background:
      linear-gradient(180deg,rgba(255,255,255,.12),transparent 42%),   /* 顶部受光带 */
      linear-gradient(135deg,rgba(255,255,255,.06),transparent 55%);   /* 斜向反光 */
    pointer-events:none;opacity:.5;transition:opacity .35s;
  }
  .card.hovered{
    background:var(--glass-card-hover);border-color:var(--border-strong);
    /* 抽出旋转正面对我：从牌堆里抽出来（往上多移+放大）+浮在上层，rotateY转正0deg由JS改inline style实现（inline优先级高于:hover） */
    --stack-s:1.15;--stack-y-extra:-50px;    /* hover时下沉偏移从330px减到-50px，相当于往上多移380px抽出（再增加50px） */
    box-shadow:var(--glass-thickness),var(--shadow-lg),0 0 32px rgba(0,230,118,.25),0 0 64px rgba(0,188,212,.12);
    z-index:50;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1) .06s,box-shadow .35s,background .35s,border-color .35s;  /* transform延迟60ms防抖：快速扫过不触发抽出，消除抽搐 */
  }
  .card.hovered::before{opacity:1}
  /* 鸠蒙6 官方点击反馈：200ms EaseOut（缓出，先快后慢），只缩scale不覆盖定位（修复点击跳位，形式不变） */
  .card:active{
    --stack-s:.96;
    transition:transform .2s cubic-bezier(.16,1,.3,1);
  }
  .card-thumb{
    height:170px;background:linear-gradient(135deg,rgba(10,12,18,.45),rgba(10,12,18,.35));
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .card-thumb::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%,rgba(0,230,118,.08),transparent 70%);
  }
  .card-thumb svg{width:52px;height:52px;color:var(--accent-2);opacity:.85;z-index:1}
  /* 模型缩略图：填充缩略区，无图时保留 IC_CUBE 占位 */
  .card-thumb-img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    z-index:1;opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .card-thumb-img.loaded{opacity:1}
  .card.hovered .card-thumb-img{transform:scale(1.06)}
  /* 有缩略图时弱化占位径向光晕，让图为主 */
  .card-thumb:has(.card-thumb-img) svg{display:none}
  .card-thumb:has(.card-thumb-img)::after{background:linear-gradient(180deg,transparent 60%,rgba(10,12,18,.5))}
  .card-body{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:8px}
  .card-name{font-size:14px;font-weight:500;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-all;color:var(--text);
  }
  .card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .card-tags .tag{
    padding:3px 10px;border-radius:var(--r-pill);font-size:11px;
    transition:transform .2s cubic-bezier(.16,1,.3,1);
  }
  .card.hovered .card-tags .tag{transform:translateY(-1px)}
  .card-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:0 18px 14px}
  .card-selected{
    background:var(--glass-strong);border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(0,230,118,.3),var(--glow-accent);
  }
  .card-check{
    position:absolute;top:12px;right:12px;width:24px;height:24px;
    border:2px solid var(--border-strong);background:var(--glass);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--accent);z-index:3;border-radius:var(--r-sm);
    backdrop-filter:blur(8px);transition:all .2s;
  }
  .card-check.checked{
    border-color:var(--accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;box-shadow:var(--glow-accent);
  }
  /* 收藏星标（卡片左上角） */
  .card-fav{
    position:absolute;top:12px;left:12px;width:26px;height:26px;
    border:none;border-radius:var(--r-sm);background:var(--glass);backdrop-filter:blur(8px);
    color:var(--muted);font-size:15px;line-height:1;cursor:pointer;z-index:3;
    display:flex;align-items:center;justify-content:center;transition:all .2s;
  }
  .card-fav:hover{transform:scale(1.12);color:var(--text)}
  .card-fav.on{color:#ffd20a;background:rgba(255,200,10,.12);text-shadow:0 0 10px rgba(255,200,10,.7);box-shadow:0 0 12px rgba(255,200,10,.2)}
  .card.keyfocus{outline:2px solid var(--accent);outline-offset:3px}

  /* 视图切换分段控件（叠卡/网格/列表） */
  .view-toggle{display:flex;align-items:center;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px;gap:2px;backdrop-filter:blur(10px)}
  .vt-btn{border:none;background:transparent;color:var(--muted);font-size:12px;padding:7px 12px;border-radius:var(--r-pill);cursor:pointer;transition:all .2s}
  .vt-btn:hover{color:var(--text)}
  .vt-btn.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--glow-accent)}
  .fav-filter.on{color:#ffd20a;border-color:rgba(255,200,10,.4);box-shadow:0 0 12px rgba(255,200,10,.15)}

  /* 统计概览面板 */
  .stats-panel{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px;
    background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);
    padding:14px 18px;backdrop-filter:blur(16px);box-shadow:var(--shadow-sm);
  }
  .stat-item{display:flex;align-items:baseline;gap:8px;padding:0 14px;border-right:1px solid var(--border)}
  .stat-item:first-child{padding-left:0}
  .stat-item:last-child{border-right:none}
  .stat-num{font-size:22px;font-weight:600;background:linear-gradient(135deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat-label{color:var(--muted);font-size:12px}
  .stat-tags{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto;padding:2px 0}
  .stat-tagbar{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:52px}
  .stat-tagbar .bar{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent-2),var(--accent));opacity:.85}

  /* 最近浏览横条 */
  .recents-strip{margin-bottom:22px}
  .recents-title{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .recents{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
  .recent-card{
    flex-shrink:0;width:150px;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;
    background:var(--glass-card);border:1px solid var(--border);backdrop-filter:blur(12px);
    transition:all .25s;
  }
  .recent-card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-md)}
  .recent-thumb{height:84px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(10,12,18,.45),rgba(10,12,18,.35))}
  .recent-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .recent-thumb svg{width:24px;height:24px;color:var(--accent-2);opacity:.8}
  .recent-card:has(img) svg{display:none}
  .recent-name{font-size:12px;padding:8px 10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 网格视图（卡片展平：不叠放、不旋转） */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding:8px 4px}
  .card-flat{position:relative;left:auto;bottom:auto;width:auto;transform:none;opacity:1;transform-origin:center}
  .card-flat:hover,.card-flat.hovered{--stack-s:1;--stack-y-extra:0;transform:translateY(-4px);z-index:5;background:var(--glass-card-hover)}
  .card-flat:hover .card-thumb-img{transform:scale(1.06)}
  .card-flat:active{transform:translateY(-2px) scale(.97)}

  /* 列表视图（横向紧凑行） */
  .list-view{display:flex;flex-direction:column;gap:10px;padding:4px}
  .card-list{flex-direction:row;align-items:center;gap:14px;padding:10px 16px}
  .card-list .list-thumb{width:64px;height:64px;border-radius:var(--r-sm);overflow:hidden;position:relative;flex-shrink:0;background:linear-gradient(135deg,rgba(10,12,18,.45),rgba(10,12,18,.35));display:flex;align-items:center;justify-content:center}
  .card-list .list-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card-list .list-thumb svg{width:26px;height:26px;color:var(--accent-2);opacity:.85}
  .card-list .list-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .card-list .list-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-list .list-tags{display:flex;flex-wrap:wrap;gap:6px}
  .card-list .list-meta{color:var(--muted);font-size:12px;text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .card-list .card-fav{position:static}
  .card-list .card-check{position:static;flex-shrink:0;cursor:pointer}
  .card-del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 8px;border-radius:6px;transition:all .2s;flex-shrink:0}
  .card-del:hover{color:var(--danger);background:rgba(232,64,58,.12)}
  .select-count{color:var(--accent-2);font-size:13px;padding:0 8px;align-self:center;font-weight:500}

  .empty{
    text-align:center;padding:100px 20px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .empty-icon svg{width:72px;height:72px;opacity:.25}
  .empty-btn{margin-top:8px}

  /* ===== 上传页 ===== */
  .upload-page{flex:1;overflow-y:auto;padding:24px 20px}
  .upload-card{
    max-width:640px;margin:0 auto;
    background:var(--glass);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:36px;backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);
  }
  .upload-card h2{font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:-.3px}
  .upload-card .hint{color:var(--muted);font-size:13px;margin-bottom:24px}
  .upload-tag-label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);margin-top:18px}
  .upload-tag-label input{
    padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-sm);
    color:var(--text);font-size:13px;font-family:inherit;transition:all .2s;
  }
  .upload-tag-label input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,230,118,.12);background:rgba(255,255,255,.06)}
  .dropzone{
    border:2px dashed var(--border-strong);border-radius:var(--r-md);
    padding:56px 20px;text-align:center;
    transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer;
    background:rgba(255,255,255,.02);
  }
  .dropzone:hover,.dropzone.over{
    border-color:var(--accent);background:rgba(0,230,118,.06);
    transform:scale(1.01);box-shadow:var(--glow-accent);
  }
  .dropzone-icon svg{width:56px;height:56px;color:var(--accent-2)}
  .dropzone-text{font-size:15px;margin-top:16px;color:var(--text);font-weight:500}
  .dropzone-hint{color:var(--muted);font-size:12px;margin-top:6px}
  .file-list{
    margin:20px 0;border:1px solid var(--border);border-radius:var(--r-md);
    background:rgba(255,255,255,.02);overflow:hidden;
  }
  .file-list li{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);font-size:13px;transition:background .2s}
  .file-list li:hover{background:rgba(255,255,255,.03)}
  .file-list li:last-child{border-bottom:none}

  /* ===== 预览页（鸿蒙6 真实毛玻璃侧栏） ===== */
  .viewer-page{flex:1;display:flex;overflow:hidden;min-height:0;height:100%}
  .viewer-side{
    width:340px;flex-shrink:0;background:var(--glass);background-image:var(--glass-refraction);
    border-right:1px solid var(--border);
    overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:16px;
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-edge);
  }
  .viewer-side h2{font-size:18px;font-weight:600;line-height:1.3;word-break:break-all;letter-spacing:-.2px}
  .viewer-side .meta{color:var(--muted);font-size:12px;line-height:1.7}
  .info-block{
    background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-all;line-height:1.6;
  }
  .tag-row{display:flex;flex-wrap:wrap;gap:6px}
  .tag-row .tag{
    padding:4px 12px;border-radius:var(--r-pill);font-size:12px;
  }
  .edit-box{border-top:1px solid var(--border);padding-top:20px;display:flex;flex-direction:column;gap:12px}
  .edit-box label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  .edit-box textarea,.edit-box input{
    padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-sm);
    color:var(--text);font-size:13px;font-family:inherit;resize:vertical;transition:all .2s;
  }
  .edit-box textarea:focus,.edit-box input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,230,118,.12);background:rgba(255,255,255,.06);
  }
  .side-actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
  .viewer-main{flex:1;background:#000;position:relative;min-width:0;display:flex}
  .viewer-main iframe{width:100%;height:100%;border:none;display:block;flex:1}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#111;border:1px solid var(--border);
    padding:10px 18px;z-index:1000;
    opacity:0;transition:all .3s;pointer-events:none;font-size:13px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 批量编辑面板 ===== */
  .batch-edit-panel{
    background:var(--glass);border:1px solid var(--border-strong);border-radius:var(--r-md);
    padding:18px 22px;margin-bottom:20px;backdrop-filter:blur(16px);box-shadow:var(--shadow-md);
    display:flex;flex-direction:column;gap:12px;
  }
  .batch-edit-title{font-size:15px;font-weight:600;color:var(--accent-2)}
  .batch-edit-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .batch-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1;min-width:240px}
  .batch-label input{
    flex:1;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:inherit;
  }
  .batch-label input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,230,118,.12)}
  .batch-mode select{
    padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:var(--r-sm);color:var(--text);font-size:13px;cursor:pointer;
  }
  .batch-mode select option{background:var(--card);color:var(--text)}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--danger)}

  /* ===== 鸿蒙6 沉浸光感精致细节（Immersive Light EXQUISITE） ===== */
  /* 粒子背景 canvas */
  .particles-bg{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
    pointer-events:none;
  }
  #app{z-index:1;position:relative}

  /* 沉浸光感：通透材质（毛玻璃）— 已在 .topbar/.card/.viewer-side 用 backdrop-filter 实现 */

  /* 沉浸光感：渐变模糊（标题栏随滚动从透明到模糊）*/
  .topbar{
    background:linear-gradient(to bottom,
      rgba(10,12,18,0) 0%,
      rgba(10,12,18,.4) 60%,
      var(--glass) 100%);
    backdrop-filter:blur(0px) saturate(1.5);
    transition:backdrop-filter .3s;
  }
  .topbar.scrolled{backdrop-filter:blur(24px) saturate(2)}

  /* 沉浸光感·按压弹性反馈：按下时弹性缩放（scale 0.96→1），仅 :active 时用回弹曲线 */
  /* 鸠蒙6 官方点击反馈：200ms EaseOut（缓出），统一定义在各组件基础规则里，此处仅保留 :active 缩放态 */
  .topbar-btn:active,.btn-accent:active,.btn-ghost:active,.btn-danger:active{
    transform:scale(.96);
    transition:transform .2s cubic-bezier(.16,1,.3,1);
  }

  /* 沉浸光感·按压点光源：触点白光晕扩散（鸿蒙6 EXQUISITE 档为白光）*/
  .topbar-btn,.btn-accent,.btn-ghost,.btn-danger{position:relative;overflow:hidden}
  .topbar-btn::before,.btn-accent::before,.btn-ghost::before,.btn-danger::before{
    content:'';position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.6),rgba(0,188,212,.3) 40%,transparent 70%);
    pointer-events:none;opacity:0;transition:opacity .6s;
    width:120px;height:120px;left:var(--px,50%);top:var(--py,50%);
    transform:translate(-50%,-50%);
  }
  .topbar-btn:active::before,.btn-accent:active::before,.btn-ghost:active::before,.btn-danger:active::before{
    opacity:1;transition:opacity 0s;
  }

  /* 沉浸光感·材质噪点：毛玻璃表面噪点纹理（鸿蒙6 材质精致感关键）*/
  .topbar,.card,.viewer-side,.batch-edit-panel,.upload-card,.dropzone,.info-block,.toast{
    background-image:
      radial-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
      radial-gradient(rgba(0,0,0,.02) 1px,transparent 1px);
    background-size:3px 3px,3px 3px;
    background-position:0 0,1.5px 1.5px;
  }

  /* 沉浸光感·光影追踪溢出：光源层默认显示，鼠标在 A 边缘时相邻卡片也产生高光 */
  .card,.topbar,.viewer-side,.btn-accent,.btn-ghost{
    --mx:-9999px;--my:-9999px;
  }
  .card::after{
    content:'';position:absolute;inset:0;border-radius:var(--r-md);pointer-events:none;
    /* 五层径向叠加润滑：不同半径错开步长+加大预模糊，彻底消除肉眼可见的梯度断层 */
    background:
      radial-gradient(circle 280px at var(--mx) var(--my),rgba(255,255,255,.14),rgba(255,255,255,.03) 20%,rgba(0,188,212,.07) 40%,rgba(0,188,212,.03) 60%,transparent 90%),
      radial-gradient(circle 220px at var(--mx) var(--my),rgba(255,255,255,.10),rgba(0,188,212,.06) 35%,rgba(0,188,212,.02) 65%,transparent 85%),
      radial-gradient(circle 160px at var(--mx) var(--my),rgba(255,255,255,.08),rgba(0,188,212,.05) 45%,transparent 80%),
      radial-gradient(circle 100px at var(--mx) var(--my),rgba(255,255,255,.06),transparent 70%),
      linear-gradient(115deg,transparent 30%,rgba(0,188,212,.05) 50%,transparent 70%);
    background-size:100% 100%,100% 100%,100% 100%,100% 100%,200% 200%;background-position:0 0,0 0,0 0,0 0,100% 0;
    opacity:1;transition:opacity .25s cubic-bezier(.16,1,.3,1);
    /* 加大预模糊：blur 1.2px 彻底柔化色带，肉眼无可见梯度 */
    filter:blur(1.2px);
  }
  .card.hovered::after{animation:cardFlow 2.5s ease-in-out infinite}
  @keyframes cardFlow{0%{background-position:0 0,0 0,0 0,0 0,100% 0}100%{background-position:0 0,0 0,0 0,0 0,-100% 0}}

  /* 沉浸光感·点光源照亮：卡片悬停时点亮周围（冷光+暖光交融，鸿蒙6 多层折射）*/
  /* transition 已在 .card 基础规则里统一定义，此处不再覆盖避免缓动曲线打架 */
  .card.hovered{
    box-shadow:
      var(--glass-thickness),var(--shadow-lg),var(--glass-edge),
      0 0 32px rgba(0,230,118,.18),       /* 冷光：蓝 */
      0 0 64px rgba(0,188,212,.08),      /* 冷光：青 */
      0 0 48px rgba(255,200,120,.04);     /* 暖光：暖白（色温交融）*/
  }

  /* 沉浸光感·智能反色：深色背景下前景色保证可读（边和文字微提亮）*/
  .card-name,.viewer-side h2,.content-title,.batch-edit-title{
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }

  /* 灵动粒子：logo 呼吸光晕（粒子流转感）*/
  .logo-icon{animation:logoBreath 4s ease-in-out infinite}
  @keyframes logoBreath{
    0%,100%{box-shadow:var(--glow-accent),inset 0 1px 1px rgba(255,255,255,.25)}
    50%{box-shadow:0 0 36px rgba(0,230,118,.45),0 0 72px rgba(0,188,212,.18),inset 0 1px 1px rgba(255,255,255,.35)}
  }

  /* 气态动效：Toast 气态浮现（鸿蒙6 气态升腾+扩散）*/
  .toast{
    backdrop-filter:blur(20px) saturate(1.8);background:var(--glass);
    border-radius:var(--r-pill);
    box-shadow:0 0 24px rgba(0,188,212,.12),var(--shadow-md);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  @media(max-width:860px){
    .viewer-side{width:100%;max-height:40vh}
    .viewer-page{flex-direction:column}
    .topbar{flex-wrap:wrap;height:auto}
    .search-wrap{order:3;flex-basis:100%;max-width:none}
  }

  /* 鸠蒙6 APP 打开转场：预览页从被点卡片位置放大到全屏。
     纯 transform:translate+scale 合成器动画（GPU 加速，不触发 reflow/重绘）：
     关键帧只动 transform+opacity，border-radius 固定不逐帧动画；动画期间隐藏 iframe 与毛玻璃（两者每帧合成极贵），
     动画结束 .open-done 再恢复并释放 will-change 合成层 */
  .viewer-enter{
    position:fixed;left:0;top:0;width:100vw;height:100vh;
    border-radius:var(--r-md);overflow:hidden;
    transform-origin:0 0;                 /* 左上角为缩放原点：translate 到卡片位置 + scale 到卡片尺寸，视觉等价于从卡片放大 */
    animation:viewerOpen .4s cubic-bezier(.34,1.56,.64,1) forwards;
    will-change:transform,opacity;
    z-index:100;
  }
  /* 动画期间降级重绘内容：iframe 有独立渲染进程，transform 缩放期间每帧参与合成（卡顿主因）→ 隐藏；毛玻璃同理关闭 */
  .viewer-enter .viewer-main{visibility:hidden}
  .viewer-enter .viewer-side{backdrop-filter:none;-webkit-backdrop-filter:none}
  /* 动画结束：恢复 iframe/毛玻璃、释放合成层（will-change:auto）、全屏直角 */
  .viewer-enter.open-done .viewer-main{visibility:visible}
  .viewer-enter.open-done .viewer-side{backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
  .viewer-enter.open-done{will-change:auto;border-radius:0}
  @keyframes viewerOpen{
    0%{
      opacity:.4;
      transform:translate(var(--ox),var(--oy)) scale(var(--sx),var(--sy));
    }
    100%{
      opacity:1;
      transform:translate(0,0) scale(1,1);
    }
  }
  /* ===== 多应用框架：左侧边栏常驻 ===== */
  #app{flex-direction:row}
  #sidebar{
    width:196px;flex-shrink:0;display:flex;flex-direction:column;
    background:var(--glass);background-image:var(--glass-refraction);
    border-right:1px solid var(--border);
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-edge);padding:16px 10px;z-index:20;overflow-y:auto;
  }
  .side-logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-size:15px;font-weight:600}
  .side-brand{white-space:nowrap}
  .side-nav{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
  .side-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);
    color:var(--muted);cursor:pointer;font-size:13.5px;transition:all .2s;border:1px solid transparent;user-select:none;
  }
  .side-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .side-item.active{background:linear-gradient(135deg,rgba(0,230,118,.18),rgba(0,188,212,.08));color:#fff;border-color:rgba(0,230,118,.35);box-shadow:inset 0 1px 1px rgba(255,255,255,.08)}
  .side-ico{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex-shrink:0}
  .side-ico svg{width:20px;height:20px}
  .side-item.active .side-ico{color:var(--accent-2)}
  .side-foot{margin-top:auto;padding:12px 10px;color:var(--muted);font-size:11px;opacity:.65}
  #main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
  @media(max-width:860px){
    #sidebar{width:58px;padding:14px 6px}
    .side-brand,.side-name,.side-foot{display:none}
    .side-logo{justify-content:center;padding:4px 0 14px}
    .side-item{justify-content:center;padding:11px 0}
    .side-ico{width:24px;height:24px}
  }

  /* ===== 笔记应用 ===== */
  .note-editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .note-title-input{padding:16px 24px 8px;font-size:22px;font-weight:600;background:transparent;border:none;color:var(--text);outline:none}
  .note-tags-input{padding:0 24px 14px;font-size:13px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--muted);outline:none}
  .note-content{flex:1;padding:14px 24px;background:transparent;border:none;color:var(--text);font-size:14.5px;line-height:1.9;resize:none;outline:none;font-family:inherit}
  .note-excerpt{color:var(--muted);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* ===== 待办应用 ===== */
  .todo-row{
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    background:var(--glass-card);border:1px solid var(--border);border-radius:var(--r-sm);
    backdrop-filter:blur(10px);transition:all .2s;margin-bottom:8px;
  }
  .todo-row:hover{border-color:var(--border-strong)}
  .todo-row.done .todo-text{color:var(--muted);text-decoration:line-through}
  .todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .2s;background:transparent}
  .todo-check.done{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:var(--accent);box-shadow:var(--glow-accent)}
  .todo-text{flex:1;font-size:14px;word-break:break-all;line-height:1.5}
  .todo-pri{padding:2px 9px;border-radius:var(--r-pill);font-size:11px;cursor:pointer;user-select:none;border:1px solid transparent}
  .todo-pri.p0{color:var(--muted);background:rgba(255,255,255,.05)}
  .todo-pri.p1{color:#ffd20a;background:rgba(255,200,10,.12);border-color:rgba(255,200,10,.25)}
  .todo-pri.p2{color:#ff7a7a;background:rgba(255,95,95,.12);border-color:rgba(255,95,95,.3)}
  .todo-due input{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:4px 8px;outline:none}
  .todo-due input:focus{border-color:var(--accent)}
  .todo-tabs{display:flex;gap:8px}
  .todo-tab{padding:7px 14px;border-radius:var(--r-pill);font-size:13px;cursor:pointer;color:var(--muted);background:var(--glass);border:1px solid var(--border);transition:all .2s;backdrop-filter:blur(8px)}
  .todo-tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:var(--glow-accent)}
  .todo-stats{color:var(--muted);font-size:13px}

  /* ===== 文件资料库 ===== */
  .file-ico{width:46px;height:46px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:rgba(255,255,255,.05)}
  .file-ico .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:var(--r-sm)}
  .file-act{display:flex;gap:6px}
  .file-act button{padding:6px 12px;font-size:12px;border:none;border-radius:var(--r-pill);cursor:pointer;color:var(--text);background:rgba(255,255,255,.06);transition:all .2s}
  .file-act button:hover{background:rgba(0,230,118,.25);color:#fff}
  .file-act .del:hover{background:rgba(232,64,58,.2);color:var(--danger)}

  /* 文件库：面包屑导航 */
  .crumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-bottom:18px}

<body>

<script>
// ============================================================
// 3D 模型库 — 纯前端单文件版（无登录 / 全屏预览 / 暗色 UI）
// 存储：IndexedDB（models 存元数据+ArrayBuffer，无独立 users 表）
// ============================================================

const DB_NAME='ModelVaultDB',DB_VERSION=3,STORE_MODELS='models',STORE_NOTES='notes',STORE_TODOS='todos',STORE_FILES='files',STORE_BOOKMARKS='bookmarks',STORE_FOLDERS='folders';
const state={view:'list',page:1,pageSize:18,q:'',tag:'',currentModelId:null,uploadFiles:[],uploadResult:null,selectMode:false,selectedIds:new Set(),batchEditOpen:false,viewMode:localStorage.getItem('mv_viewMode')||'stack',favOnly:false,keyIndex:-1,
  app:'models',
  noteView:'list',noteEditId:null,noteQ:'',
  todoFilter:'all',
  filesView:'list',filesQ:'',filesTag:'',filesUpload:[],filesUploadResult:null,filesTags:'',filesFolderId:null,fileMoveId:null,
  bmQ:'',bmTag:'',
  toolId:null};
let db=null;

// ---------- IndexedDB ----------
function openDB(){return new Promise((res,rej)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onerror=()=>rej(req.error);
  req.onsuccess=()=>{db=req.result;res(db)};
  req.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains(STORE_MODELS))d.createObjectStore(STORE_MODELS,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(STORE_NOTES))d.createObjectStore(STORE_NOTES,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(STORE_TODOS))d.createObjectStore(STORE_TODOS,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(STORE_FILES))d.createObjectStore(STORE_FILES,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(STORE_BOOKMARKS))d.createObjectStore(STORE_BOOKMARKS,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(STORE_FOLDERS))d.createObjectStore(STORE_FOLDERS,{keyPath:'id',autoIncrement:true});};
});}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function dbGet(s,k){return new Promise((res,rej)=>{const r=tx(s,'readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbAll(s){return new Promise((res,rej)=>{const r=tx(s,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbAdd(s,v){return new Promise((res,rej)=>{const r=tx(s,'readwrite').add(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPut(s,v){return new Promise((res,rej)=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbDelete(s,k){return new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

// ---------- 工具 ----------
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB';}
function fmtDate(ts){return new Date(ts).toLocaleDateString('zh-CN');}
function fmtDateTime(ts){return new Date(ts).toLocaleString('zh-CN',{hour12:false});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseTags(str){return[...new Set(str.split(/[,，]/).map(s=>s.trim()).filter(Boolean))];}


// ---------- 模型 CRUD ----------
// 从 HTML 文件内容中提取 <title> 标签的文本
function extractTitleFromHtml(arrayBuffer) {
  try {
    // 只解码前 8KB 寻找 title，避免大文件全量解码
    const slice = arrayBuffer.slice(0, 8192);
    const text = new TextDecoder('utf-8', { fatal: false }).decode(slice);
    const match = text.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (match && match[1]) {
      return match[1].trim().replace(/\s+/g, ' ');
    }
  } catch (e) {
    console.warn('提取 title 失败', e);
  }
  return '';
}

// 从 HTML 文件内容中提取首张图片：支持双引号/单引号/无引号 src，优先 data:image 内联，其次外链，限前 256KB
function extractThumbFromHtml(arrayBuffer) {
  try {
    const slice = arrayBuffer.slice(0, 262144);
    const text = new TextDecoder('utf-8', { fatal: false }).decode(slice);
    // 优先：data:image 内联图（base64 或 URL 编码），体积上限 256KB 避免撑爆 IndexedDB
    // 支持双引号/单引号/无引号三种 src 写法
    const dataMatch = text.match(/<img[^>]+src\s*=\s*(["']?)(data:image\/[^"'\s>]{0,262144})\1/i);
    if (dataMatch && dataMatch[2]) return dataMatch[2];
    // 其次：http(s) 外链图
    const urlMatch = text.match(/<img[^>]+src\s*=\s*(["']?)(https?:\/\/[^"'\s>]+)\1/i);
    if (urlMatch && urlMatch[2]) return urlMatch[2];
    // 再次：相对路径图（提取后无法直接用，但记录下来供 onerror 时降级）
    const relMatch = text.match(/<img[^>]+src\s*=\s*(["'])([^"']+)\1/i);
    if (relMatch && relMatch[2] && !/^(data:|https?:)/.test(relMatch[2])) return '';
  } catch (e) {
    console.warn('提取缩略图失败', e);
  }
  return '';
}

async function addModel(file,tags){
  const content=await file.arrayBuffer();
  const title = extractTitleFromHtml(content);
  const thumb = extractThumbFromHtml(content);
  return await dbAdd(STORE_MODELS,{
    filename:file.name,originalName:file.name,content:content,
    size:file.size,note:'',tags:tags||[],
    title:title,thumb:thumb,fav:false,
    createdAt:Date.now()
  });
}
// 给老数据（缺 thumb 字段或空串）补提取缩略图，启动时跑一次
async function backfillThumbs(){
  const all=await dbAll(STORE_MODELS);
  for(const m of all){
    if(m.thumb)continue;   // 已有非空缩略图跳过，空串/undefined 都重试
    const thumb=extractThumbFromHtml(m.content);
    if(thumb){             // 只在提取到真值时才写回，避免空串覆盖
      m.thumb=thumb;
      await dbPut(STORE_MODELS,m);
    }
  }
}
async function updateModel(id,patch){const m=await dbGet(STORE_MODELS,id);if(!m)return;Object.assign(m,patch);await dbPut(STORE_MODELS,m);}
async function getBlobById(store,id,mime){const m=await dbGet(store,id);if(!m)return null;return{blob:new Blob([m.content],{type:mime||'application/octet-stream'}),model:m};}
function getModelBlob(id){return getBlobById(STORE_MODELS,id,'text/html');}
function getAllModels(){return dbAll(STORE_MODELS);}

// ---------- 标签取色（哈希稳定着色，鸿蒙6 炫彩标签） ----------
// 鸠蒙6 配色：12 炫彩，按标签文本哈希稳定映射，同名标签永远同色，分散哈希混合降低撞色
const TAG_PALETTE=[
  {bg:'rgba(0,230,118,.14)',  fg:'#00BCD4', glow:'rgba(0,230,118,.25)'},   // 蓝
  {bg:'rgba(52,199,89,.14)',  fg:'#34c759', glow:'rgba(52,199,89,.25)'},    // 绿
  {bg:'rgba(255,159,10,.14)', fg:'#ffb40a', glow:'rgba(255,159,10,.25)'},  // 橙
  {bg:'rgba(255,95,95,.14)',  fg:'#ff7a7a', glow:'rgba(255,95,95,.25)'},   // 粉红
  {bg:'rgba(175,95,255,.14)', fg:'#b377ff', glow:'rgba(175,95,255,.25)'},  // 紫
  {bg:'rgba(0,199,200,.14)',  fg:'#33d9d9', glow:'rgba(0,199,200,.25)'},   // 青
  {bg:'rgba(255,200,10,.14)', fg:'#ffd20a', glow:'rgba(255,200,10,.25)'},  // 黄
  {bg:'rgba(255,85,145,.14)', fg:'#ff6e9c', glow:'rgba(255,85,145,.25)'},  // 玫红
  {bg:'rgba(102,153,255,.14)',fg:'#6c9eff', glow:'rgba(102,153,255,.25)'},// 天蓝
  {bg:'rgba(102,255,178,.14)',fg:'#66ffb2', glow:'rgba(102,255,178,.25)'},// 翠绿
  {bg:'rgba(255,119,51,.14)', fg:'#ff7a33', glow:'rgba(255,119,51,.25)'}, // 橘红
  {bg:'rgba(138,92,246,.14)', fg:'#8a5cf6', glow:'rgba(138,92,246,.25)'}, // 靛紫
];
// 顺序映射表：按标签首次出现顺序分配调色板下标，保证不同标签必不同色
const TAG_COLOR_MAP=new Map();
let _tagColorNext=0;
function tagColor(name){
  if(!name)return TAG_PALETTE[0];
  if(!TAG_COLOR_MAP.has(name)){
    if(_tagColorNext<TAG_PALETTE.length){
      TAG_COLOR_MAP.set(name,_tagColorNext++);
    }else{
      let h=0;for(let i=0;i<name.length;i++)h=((h<<5)-h+name.charCodeAt(i))|0;
      TAG_COLOR_MAP.set(name,Math.abs(h)%TAG_PALETTE.length);
    }
  }
  return TAG_PALETTE[TAG_COLOR_MAP.get(name)];
}

// ---------- 搜索/过滤 ----------
// 模糊匹配：查询字符按顺序出现即命中（允许跳字），容错强、命中范围广
function fuzzyMatch(text,q){
  if(!q)return true;
  text=(text||'').toLowerCase();q=q.toLowerCase();
  let ti=0;
  for(const ch of q){
    ti=text.indexOf(ch,ti);
    if(ti===-1)return false;
    ti++;
  }
  return true;
}
// 相关度评分：连续匹配越长、越靠前，分越高（用于排序最佳命中在前）
function fuzzyScore(text,q){
  if(!q)return 1;
  text=(text||'').toLowerCase();q=q.toLowerCase();
  let score=0,ti=0,run=0;
  for(const ch of q){
    const next=text.indexOf(ch,ti);
    if(next===-1)return 0;
    // 靠前加分 + 连续匹配奖励（run 越长分越高）
    score+=2+(run*1);
    if(next===ti)run++;else run=0;
    ti=next+1;
  }
  // 整体命中位置越靠前分越高
  score-=text.indexOf(q[0])*.3;
  return score;
}
function filterModels(models,q,tag,favOnly){
  let r=models;
  if(favOnly)r=r.filter(m=>!!m.fav);          // 只看收藏
  if(tag)r=r.filter(m=>(m.tags||[]).includes(tag));
  const pinned=(a,b)=>((b.fav?1:0)-(a.fav?1:0));   // 收藏置顶
  if(q){
    r=r.filter(m=>
      fuzzyMatch(m.originalName||'',q)||
      fuzzyMatch(m.note||'',q)||
      (m.tags||[]).some(t=>fuzzyMatch(t,q)));
    // 按相关度排序：分高的在前（收藏仍置顶）
    const qs=(m)=>Math.max(
      fuzzyScore(m.originalName||'',q),
      fuzzyScore(m.note||'',q),
      ...(m.tags||[]).map(t=>fuzzyScore(t,q)));
    return r.sort((a,b)=>pinned(a,b)||qs(b)-qs(a));
  }
  return r.sort((a,b)=>pinned(a,b)||b.createdAt-a.createdAt);
}
function getAllTags(models){
  const c={};models.forEach(m=>(m.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  return Object.entries(c).map(([name,count])=>({name,count})).sort((a,b)=>a.name.localeCompare(b.name));
}

// ---------- Toast ----------
let toastTimer;
function toast(msg,type=''){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.className='toast show '+type;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast '+type,2500);
}

const IC_SEARCH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';

const IC_NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

const IC_TOOLS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14.7 6.3a4 4 0 0 0-5.4-5.4L12 3.5 9.5 6 6.3 2.8a4 4 0 0 0 5.4 5.4L14 10.6 8.6 16l2.1 2.1 5.4-5.4 2.8 2.8a4 4 0 0 0-5.4-5.4Z"/><path d="M6 18l-2 4"/></svg>';
const APPS=[
  {id:'models',name:'模型库',icon:IC_LOGO},

// ---------- 卡片渲染助手（收藏/缩略图/标签 + 三种视图卡片） ----------
function favStar(m,store){
  const st=store||STORE_MODELS;
  return `<button class="card-fav ${m.fav?'on':''}" title="${m.fav?'取消收藏':'收藏'}" onclick="event.stopPropagation();toggleFavIn('${st}',${m.id})">${m.fav?'★':'☆'}</button>`;
}
function thumbHtml(m){
  return m.thumb
    ? `<img class="card-thumb-img" src="${m.thumb}" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.style.display='none'">${IC_CUBE}`
    : IC_CUBE;
}
function tagsHtml(m){
  const tags=(m.tags||[]).slice(0,3).map(function(t){const c=tagColor(t);return '<span class="tag" style="background:'+c.bg+';color:'+c.fg+';box-shadow:0 0 12px '+c.glow+'">'+escapeHtml(t)+'</span>';}).join('');
  if(m.cloud)tags+='<span class="cloud-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>云端</span>';
  return tags;
}
function stackCard(m,i,models){
  const selected=state.selectedIds.has(m.id);
  const inSelect=state.selectMode;
  // 横向重叠堆叠：中间那张卡片居中（整体卡片堆中心对齐容器中心），每张往上移 i*297px
  const mid=Math.floor(models.length/2);     // 中间那张卡片的序号
  const sx=(-90+(i-mid)*40)+'px';            // 居中偏移：以中间那张为基准（往左偏90px居中）+ 相对它往右错位(i-mid)*40px
  const sy=(-i*297)+'px';                    // 往上移：每张往上移 297px（距底边距离 i*297 像素，translateY 负值往上）
  const sry=(78-i)+'deg';                    // 倾斜角度：每张倾角递减 78-i，越往右越倾斜
  return `
  <div class="card ${selected?'card-selected':''}" data-id="${m.id}" style="--stack-x:${sx};--stack-y:${sy};--stack-ry:${sry};z-index:${20-i}" data-ry="${sry}" data-sx="${(-90+(i-mid)*40)}" data-sy="${(-i*297)}" onclick="${inSelect?`toggleSelect(${m.id})`:`openViewer(${m.id},event)`}">
    ${inSelect?`<div class="card-check ${selected?'checked':''}">${selected?'✓':''}</div>`:favStar(m)}
    <div class="card-thumb">${thumbHtml(m)}</div>
    <div class="card-body">
      <div class="card-name" title="${escapeHtml(m.originalName)}">${escapeHtml(m.originalName)}</div>
      <div class="card-tags">${tagsHtml(m)}</div>
    </div>
    <div class="card-foot">
      <span>${fmtSize(m.size)}</span>
      <span>${fmtDate(m.createdAt)}</span>
    </div>
  </div>`;
}
function gridCard(m){
  const selected=state.selectedIds.has(m.id);
  const inSelect=state.selectMode;
  return `
  <div class="card card-flat ${selected?'card-selected':''}" data-id="${m.id}" onclick="${inSelect?`toggleSelect(${m.id})`:`openViewer(${m.id},event)`}">
    ${inSelect?`<div class="card-check ${selected?'checked':''}">${selected?'✓':''}</div>`:favStar(m)}
    <div class="card-thumb">${thumbHtml(m)}</div>
    <div class="card-body">
      <div class="card-name" title="${escapeHtml(m.originalName)}">${escapeHtml(m.originalName)}</div>
      <div class="card-tags">${tagsHtml(m)}</div>
    </div>
    <div class="card-foot">
      <span>${fmtSize(m.size)}</span>
      <span>${fmtDate(m.createdAt)}</span>
    </div>
  </div>`;
}
function listRow(m){
  const selected=state.selectedIds.has(m.id);
  const inSelect=state.selectMode;
  return `
  <div class="card card-flat card-list ${selected?'card-selected':''}" data-id="${m.id}" onclick="${inSelect?`toggleSelect(${m.id})`:`openViewer(${m.id},event)`}">
    ${inSelect?`<button class="card-check ${selected?'checked':''}">${selected?'✓':''}</button>`:favStar(m)}
    <div class="list-thumb">${m.thumb?`<img src="${m.thumb}" alt="" loading="lazy" onerror="this.style.display='none'">${IC_CUBE}`:IC_CUBE}</div>
    <div class="list-main">
      <div class="list-name" title="${escapeHtml(m.originalName)}">${escapeHtml(m.originalName)}</div>

// ---------- 统计概览 ----------
function renderStats(all){
  if(!all)return '';
  const total=all.length;
  const size=all.reduce((s,m)=>s+(m.size||0),0);
  const favs=all.filter(m=>m.fav).length;
  const tagCount={};
  all.forEach(m=>(m.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const top=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max=top.length?top[0][1]:1;
  return `
    <div class="stats-panel">
      <div class="stat-item"><span class="stat-num">${total}</span><span class="stat-label">个模型</span></div>
      <div class="stat-item"><span class="stat-num">${fmtSize(size)}</span><span class="stat-label">存储占用</span></div>
      <div class="stat-item"><span class="stat-num">${favs}</span><span class="stat-label">收藏</span></div>
      <div class="stat-item"><span class="stat-num">${Object.keys(tagCount).length}</span><span class="stat-label">标签种类</span></div>
      ${top.length?`<div class="stat-tags">${top.map(([n,c])=>`<div class="stat-tagbar"><span>${escapeHtml(n)} ${c}</span><div class="bar" style="width:${Math.round(28+c/max*70)}px"></div></div>`).join('')}</div>`:''}
    </div>`;
}

// ---------- 最近浏览横条 ----------
function renderRecents(all){
  if(!all)return '';
  const rec=all.filter(m=>m.lastViewedAt).sort((a,b)=>b.lastViewedAt-a.lastViewedAt).slice(0,6);
  if(!rec.length)return '';
  return `<div class="recents-strip">

      <div class="recent-card" onclick="openViewer(${m.id},event)" title="${escapeHtml(m.originalName)}">

async function toggleFavIn(store,id){
  const m=await dbGet(store,id);
  if(!m)return;
  m.fav=!m.fav;
  await dbPut(store,m);
  toast(m.fav?'已收藏':'已取消收藏',m.fav?'ok':'');
  render();
}
function toggleFav(id){return toggleFavIn(STORE_MODELS,id);}
function toggleFavFilter(){
  state.favOnly=!state.favOnly;
  state.page=1;state.keyIndex=-1;
  render();
}
function setViewMode(m){
  state.viewMode=m;
  state.keyIndex=-1;
  localStorage.setItem('mv_viewMode',m);
  clearTimeout(hoverSwitchT);clearTimeout(hoverRetractT);
  if(hoverCard){setCardHover(hoverCard,false);hoverCard=null;}
  render();
}
function applyKeyFocus(){
  const cards=[...document.querySelectorAll('.card')];
  cards.forEach((c,i)=>c.classList.toggle('keyfocus',i===state.keyIndex));
  if(state.keyIndex>=0&&cards[state.keyIndex])cards[state.keyIndex].scrollIntoView({block:'nearest'});
}
function initShortcuts(){
  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='Escape'){
      if(state.app==='notes'&&state.noteView==='editor'){backToNotes();return;}
      if(state.app==='tools'&&state.toolId){closeTool();return;}
      if(state.app==='files'&&state.fileMoveId!=null){closeMoveDialog();return;}
      if(state.app==='files'&&state.filesView==='upload'){backFiles();return;}
      if(state.app==='models'){
        if(state.view==='viewer'){goList();return;}
        if(state.selectMode){exitSelectMode();return;}
        if(state.batchEditOpen){closeBatchEdit();return;}
      }
      return;
    }
    if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){
      e.preventDefault();
      if(state.app==='notes'&&state.noteView==='editor')saveNote();
      return;
    }
    if(typing)return;
    if(e.key==='/'){
      e.preventDefault();
      const s=document.getElementById('search');
      if(s){s.focus();s.select();}
      return;
    }
    if(state.app!=='models'||state.view!=='list')return;
    const cards=[...document.querySelectorAll('.card')];
    if(!cards.length)return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){
      e.preventDefault();
      state.keyIndex=Math.min(cards.length-1,state.keyIndex+1);
      applyKeyFocus();
    }else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
      e.preventDefault();
      state.keyIndex=Math.max(0,state.keyIndex-1);
      applyKeyFocus();
    }else if(e.key==='Enter'&&state.keyIndex>=0){
      e.preventDefault();
      const c=cards[state.keyIndex];
      if(state.selectMode)toggleSelect(Number(c.dataset.id));
      else if(c)openViewer(c.dataset.id,{currentTarget:c});
    }else if((e.key==='f'||e.key==='F')&&state.keyIndex>=0&&!state.selectMode){
      e.preventDefault();
      const c=cards[state.keyIndex];
      if(c)toggleFav(Number(c.dataset.id));
    }
  });
}

// ---------- 渲染：预览（全屏 iframe） ----------
function renderViewer(model){
  if(!model)return `<div class="empty">模型不存在</div>`;
  // 鸠蒙6 APP 打开转场：起点为被点卡片的屏上位置和尺寸，预览页从此放大到全屏
  // 转场用 transform:translate+scale 合成器动画：--ox/--oy 起点偏移，--sx/--sy 起点缩放比（卡片尺寸/全屏尺寸）
  const rect=state.openFromRect;
  const vw=window.innerWidth,vh=window.innerHeight;
  const ox=rect?rect.x+'px':'0';
  const oy=rect?rect.y+'px':'0';
  const sx=rect?Math.max(.05,rect.w/vw):1;
  const sy=rect?Math.max(.05,rect.h/vh):1;
  return `
    <header class="topbar" style="z-index:200">  <!-- z-index高于viewer-enter(100)：全屏预览放大后返回按钮不被盖住 -->
      <div class="logo"><div class="logo-icon">${IC_LOGO}</div><span>3D 模型库</span></div>
      <div class="topbar-spacer"></div>
      <button class="topbar-btn btn-ghost" onclick="goList()">‹ 返回列表</button>
    </header>
    <div class="viewer-page viewer-enter" style="--ox:${ox};--oy:${oy};--sx:${sx};--sy:${sy}">
      <aside class="viewer-side">
        <h2>${escapeHtml(model.originalName)}</h2>
        <div class="meta">${fmtSize(model.size)}<br>上传于 ${fmtDateTime(model.createdAt)}</div>
        ${model.note?`<div class="info-block">${escapeHtml(model.note)}</div>`:''}
        <div class="tag-row">${(model.tags||[]).map(t=>{const c=tagColor(t);return `<span class="tag" style="background:${c.bg};color:${c.fg};box-shadow:0 0 12px ${c.glow}">${escapeHtml(t)}</span>`}).join('')}</div>
        <div class="edit-box">
          <h3 style="font-size:14px">编辑信息</h3>
          <label>备注<textarea id="noteEdit" rows="3" maxlength="2000">${escapeHtml(model.note||'')}</textarea></label>
          <label>标签（逗号分隔）<input type="text" id="tagEdit" value="${escapeHtml((model.tags||[]).join(', '))}" placeholder="例如：角色, 建筑物"></label>
          <div style="display:flex;gap:8px">
            <button class="topbar-btn btn-accent" style="flex:1;justify-content:center" onclick="saveModelEdit(${model.id})">保存</button>
            <button class="topbar-btn btn-danger" style="flex:1;justify-content:center" onclick="deleteCurrentModel(${model.id})">删除</button>
          </div>
        </div>
        <div class="side-actions">
          <button class="topbar-btn btn-ghost" style="flex:1;justify-content:center" onclick="toggleFav(${model.id})">${model.fav?'★ 已收藏':'☆ 收藏'}</button>

          <button class="topbar-btn btn-ghost" style="flex:1;justify-content:center" onclick="openFull(${model.id})">⛶ 全屏</button>
        </div>
      </aside>
      <main class="viewer-main">
        <iframe id="modelFrame" src="about:blank"></iframe>

}

// ---------- 文件资料库 ----------
function fileTypeOf(name){
  const ext=(String(name).split('.').pop()||'').toLowerCase();
  if(['png','jpg','jpeg','gif','webp','svg','bmp','ico'].includes(ext))return{ico:'🖼',mime:'image/'+ext};
  if(['pdf'].includes(ext))return{ico:'📄',mime:'application/pdf'};
  if(['zip','rar','7z','tar','gz'].includes(ext))return{ico:'🗜',mime:'application/octet-stream'};
  if(['doc','docx','txt','md','odt'].includes(ext))return{ico:'📝',mime:'text/plain'};
  if(['mp4','webm','mov','avi','mkv'].includes(ext))return{ico:'🎬',mime:'video/mp4'};
  if(['mp3','wav','flac','ogg','m4a'].includes(ext))return{ico:'🎵',mime:'audio/mpeg'};
  if(['xls','xlsx','csv'].includes(ext))return{ico:'📊',mime:'text/csv'};
  return{ico:'📦',mime:'application/octet-stream'};
}

  // 每个文件夹内的项数（文件 + 子文件夹）
  const counts={};
  all.forEach(f=>{const k=f.folderId||null;counts[k]=(counts[k]||0)+1;});

    const okQ=!state.filesQ||fuzzyMatch(f.originalName||'',state.filesQ)||(f.tags||[]).some(t=>fuzzyMatch(t,state.filesQ));

async function doFilesUpload(){
  if(!state.filesUpload.length)return;
  const tagInput=document.getElementById('uploadTags2');
  const tags=tagInput?parseTags(tagInput.value):[];
  state.filesTags=tagInput?tagInput.value:'';
  let ok=0,fail=0;
  for(const f of state.filesUpload){
    try{
      const content=await f.arrayBuffer();

      const thumb=ft.mime.startsWith('image/')?await makeImageThumb(content):'';
      await dbAdd(STORE_FILES,{originalName:f.name,content,size:f.size,note:'',tags,fav:false,createdAt:Date.now(),thumb,folderId:state.filesFolderId});
      ok++;
    }catch(e){console.error(e);fail++;}
  }
  state.filesUploadResult={ok:true,msg:`✓ 成功上传 ${ok} 个${fail?'，'+fail+' 个失败':''}`};
  state.filesUpload=[];
  toast(`成功上传 ${ok} 个文件`,'ok');
  render();

function makeImageThumb(buf){
  return new Promise(res=>{
    const url=URL.createObjectURL(new Blob([buf]));
    const img=new Image();
    img.onload=()=>{
      const max=200;
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));
      c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',.7));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res('');};
    img.src=url;
  });
}

function enterFolder(id){state.filesFolderId=id;render();}

// 从当前文件夹向上回溯出完整路径（根 → … → 当前）
function folderPath(folders,id){
  const byId={};folders.forEach(f=>byId[f.id]=f);
  const path=[];let cur=id!=null?byId[id]:null;
  while(cur){path.unshift(cur);cur=cur.parentId!=null?byId[cur.parentId]:null;}
  return path;
}
// 每个文件夹的层级深度（移动对话框缩进用）
function folderDepthMap(folders){
  const byId={};folders.forEach(f=>byId[f.id]=f);
  const depth={};
  folders.forEach(f=>{let d=0,p=f.parentId;while(p!=null&&byId[p]){d++;p=byId[p].parentId;}depth[f.id]=d;});
  return depth;
}

async function deleteFolder(id){

  const sub=folders.filter(x=>(x.parentId||null)===id);
  const files=(await dbAll(STORE_FILES)).filter(f=>(f.folderId||null)===id);
  const total=sub.length+files.length;
  if(!confirm(`确认删除文件夹？${total?`其中的 ${total} 项将移回上级目录。`:''}`))return;
  for(const x of sub){x.parentId=null;await dbPut(STORE_FOLDERS,x);}
  for(const f of files){f.folderId=null;await dbPut(STORE_FILES,f);}
  await dbDelete(STORE_FOLDERS,id);
  if(state.filesFolderId===id)state.filesFolderId=null;
  toast('已删除文件夹','ok');
  render();
}

      </div>
      <select class="filter-select" onchange="onBmTagChange(this.value)">

      <div class="content-header">

function bmHost(url){try{return new URL(url).hostname;}catch(e){return url;}}
function bmCard(b){
  const host=bmHost(b.url);
  return `
  <div class="card card-flat bm-card" data-id="${b.id}">
    ${favStar(b,STORE_BOOKMARKS)}
    <div style="display:flex;align-items:center;gap:12px">
      <div class="bm-fav"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" onerror="this.style.display='none'">🌐</div>
      <div style="flex:1;min-width:0">
        <div class="bm-title" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</div>
        <div class="bm-url" title="${escapeHtml(b.url)}">${escapeHtml(host)}</div>
      </div>
    </div>
    <div class="card-tags">${tagsHtml(b)}</div>
    <div class="card-foot" style="padding:0">
      <span>${fmtDate(b.createdAt)}</span>
      <span style="display:flex;gap:6px">
        <button class="card-del" onclick="openBookmarkById(${b.id})">打开 ↗</button>
        <button class="card-del" onclick="deleteBookmark(${b.id})">✕</button>
      </span>
    </div>
  </div>`;
}
async function addBookmark(){
  const title=document.getElementById('bmTitle').value.trim();
  let url=document.getElementById('bmUrl').value.trim();
  const tags=parseTags(document.getElementById('bmTags').value);
  if(!url){toast('请输入网址','err');return;}
  if(/^(javascript|data|vbscript):/i.test(url)){toast('仅支持 http/https 链接','err');return;}
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  await dbAdd(STORE_BOOKMARKS,{title:title||url,url,tags,fav:false,createdAt:Date.now()});
  document.getElementById('bmTitle').value='';
  document.getElementById('bmUrl').value='';
  document.getElementById('bmTags').value='';
  toast('已添加书签','ok');
  render();
}
async function openBookmarkById(id){
  const b=await dbGet(STORE_BOOKMARKS,id);
  if(b)window.open(b.url,'_blank');
}
async function deleteBookmark(id){
  if(!confirm('确认删除此书签？'))return;
  await dbDelete(STORE_BOOKMARKS,id);
  toast('已删除','ok');
  render();
}
function onBmTagChange(v){state.bmTag=v;render();}
function bindBookmarksList(){
  const s=document.getElementById('bmSearch');
  if(s){let t;s.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{state.bmQ=s.value.trim();render();},300);});}
}

function bindTool(id){

// -- 计算器 --
function calcInput(k){
  const d=document.getElementById('calcDisp');
  let e=d.textContent;
  if(k==='C'){e='0';}
  else if(k==='⌫'){e=e.length>1?e.slice(0,-1):'0';}
  else if(k==='='){
    try{
      const expr=e.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
      if(!/^[0-9+\-*/(). ]+$/.test(expr)){e='错误';}
      else{
        const v=Function('"use strict";return('+expr+')')();
        e=String(parseFloat(v.toFixed(10)));
      }
    }catch(err){e='错误';}
  }
  else{
    if(e==='0'&&/[0-9]/.test(k))e=k;
    else e+=k;
    if(e.length>30)e='错误';
  }
  d.textContent=e;
}

function cvRender(){
  const type=document.getElementById('cvType').value;
  const from=document.getElementById('cvFrom');
  const to=document.getElementById('cvTo');
  let units;
  if(type==='temp')units=['C','F','K'];
  else units=Object.keys(CV_UNITS[type]);
  from.innerHTML=units.map(u=>`<option value="${u}">${CV_LABEL[type][u]}</option>`).join('');
  to.innerHTML=units.map(u=>`<option value="${u}">${CV_LABEL[type][u]}</option>`).join('');
  to.value=units[1];
  cvCalc();
}
function cvCalc(){
  const type=document.getElementById('cvType').value;
  const v=parseFloat(document.getElementById('cvVal').value);
  const from=document.getElementById('cvFrom').value;
  const to=document.getElementById('cvTo').value;
  const res=document.getElementById('cvRes');
  if(isNaN(v)){res.textContent='—';return;}
  let out;
  if(type==='temp'){
    let c;
    if(from==='C')c=v;else if(from==='F')c=(v-32)*5/9;else c=v-273.15;
    if(to==='C')out=c;else if(to==='F')out=c*9/5+32;else out=c+273.15;
  }else{
    out=v*CV_UNITS[type][from]/CV_UNITS[type][to];
  }
  res.textContent=fmtNum(out);
}
// 数值显示：大数/小数用科学计数法，其余去尾零
function fmtNum(v){
  if(!isFinite(v))return '∞';
  if(v===0)return '0';
  const a=Math.abs(v);
  if(a>=1e9||a<1e-4)return v.toExponential(6).replace(/\.?0+e/,'e');
  return parseFloat(v.toFixed(6)).toString();
}
// -- 随机数 --
function rdGen(){
  const min=parseInt(document.getElementById('rdMin').value)||0;
  const max=parseInt(document.getElementById('rdMax').value)||100;
  const n=Math.min(50,Math.max(1,parseInt(document.getElementById('rdCount').value)||1));
  const lo=Math.min(min,max),hi=Math.max(min,max);
  const span=hi-lo+1;
  let arr;
  if(span>=n){const s=new Set();while(s.size<n)s.add(lo+Math.floor(Math.random()*span));arr=[...s];}
  else arr=Array.from({length:n},()=>lo+Math.floor(Math.random()*span));
  document.getElementById('rdRes').innerHTML=arr.map(x=>`<span class="chip">${x}</span>`).join('');
}
// -- 颜色 --
function hexToRgb(hex){
  hex=(hex||'').replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  if(isNaN(n))return null;
  return[(n>>16)&255,(n>>8)&255,n&255];
}
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0;const l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    if(max===r)h=(g-b)/d+(g<b?6:0);
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h/=6;
  }
  return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}
function clSyncFromPick(v){
  document.getElementById('clHex').value=v;
  const rgb=hexToRgb(v);
  if(!rgb)return;
  document.getElementById('clRgb').value=`rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
  const hsl=rgbToHsl(rgb[0],rgb[1],rgb[2]);
  document.getElementById('clHsl').value=`hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`;
}
function clSyncFromHex(v){
  v=(v||'').trim();
  if(!/^#?[0-9a-fA-F]{3}$|^#?[0-9a-fA-F]{6}$/.test(v))return;
  const hex='#'+v.replace('#','');
  document.getElementById('clPick').value=hex;
  clSyncFromPick(hex);
}
function clCopy(id){
  const el=document.getElementById(id);
  if(!el)return;
  const v=el.value;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast('已复制','ok'),()=>{});
  else{el.select();try{document.execCommand('copy');toast('已复制','ok');}catch(e){}}
}
// -- 文本统计 --
function tsCalc(){
  const t=document.getElementById('tsText').value;
  const chars=t.length;
  const charsNoSpace=t.replace(/\s/g,'').length;
  const words=(t.trim().match(/\S+/g)||[]).length;
  const lines=t?t.split('\n').length:0;
  document.getElementById('tsRes').textContent=`${chars} 字符 ${charsNoSpace} 字（去空白） ${words} 词 ${lines} 行`;
}
// -- Base64 --
function b64Encode(){
  const v=document.getElementById('b64In').value;
  try{document.getElementById('b64Out').value=btoa(unescape(encodeURIComponent(v)));}
  catch(e){toast('编码失败','err');}
}
function b64Decode(){
  const v=document.getElementById('b64In').value.trim();
  try{document.getElementById('b64Out').value=decodeURIComponent(escape(atob(v)));}
  catch(e){toast('解码失败：不是合法的 Base64','err');}
}
function b64Copy(){
  const out=document.getElementById('b64Out');
  if(!out.value){toast('没有结果可复制','');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(out.value).then(()=>toast('已复制','ok'),()=>{});
  else{out.select();try{document.execCommand('copy');toast('已复制','ok');}catch(e){}}
}

// ---------- 主渲染 ----------
async function render(){
  const app=document.getElementById('app');
  app.innerHTML=renderSidebar()+'<main id="main"></main>';
  const main=app.querySelector('#main');
  try{
    if(state.app==='notes'){await renderNotes(main);return;}
    if(state.app==='todos'){await renderTodos(main);return;}
    if(state.app==='files'){await renderFilesApp(main);return;}
    if(state.app==='bookmarks'){await renderBookmarksApp(main);return;}
    if(state.app==='tools'){renderToolsApp(main);return;}
  }catch(e){
    console.error(e);
    main.innerHTML=`<div class="empty"><div class="empty-icon">${IC_WARN}</div><h2>应用加载失败</h2><p>${escapeHtml(e.message||String(e))}</p></div>`;
    return;
  }
  // ===== 3D 模型库 =====
  if(state.view==='viewer'){
    const model=isCloudId(state.currentModelId)?getCloudModel(state.currentModelId):await dbGet(STORE_MODELS,state.currentModelId);
    main.innerHTML=renderViewer(model);
    // 打开转场动画期间 iframe 保持 about:blank + visibility:hidden（不参与合成，卡顿主因）；
    // 动画结束（animationend）才加载模型内容并恢复毛玻璃/iframe/释放合成层
    const ve=main.querySelector('.viewer-enter');
    if(ve&&model){
      ve.addEventListener('animationend',()=>{
        ve.classList.add('open-done');
        loadModelIntoIframe(state.currentModelId);
      },{once:true});
    }else if(ve){
      ve.classList.add('open-done');
    }else if(model){
      loadModelIntoIframe(state.currentModelId);
    }
    return;
  }
  if(state.view==='upload'){
    main.innerHTML=renderUpload();
    bindUpload();
    return;
  }
  // list
  const localAll=await getAllModels();
  // 合并本地模型与云端模型
  const all=[...localAll,...cloudModels];
  const allTags=getAllTags(all);
  const filtered=filterModels(all,state.q,state.tag,state.favOnly);
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/state.pageSize));
  if(state.page>totalPages)state.page=totalPages;
  const offset=(state.page-1)*state.pageSize;
  const pageModels=filtered.slice(offset,offset+state.pageSize);
  main.innerHTML=renderList(pageModels,allTags,total,totalPages,all);
  bindList();
  applyKeyFocus();
  if(window.__invalidateLightCache)window.__invalidateLightCache();   // 失效光影缓存，避免用旧卡片列表
}

// ---- 卡片 hover 抽出：JS mousemove 委托 + 120ms 确认切换 ----
// 叠卡左右错位，浏览器 :hover 在卡片放大盖住相邻卡时会左右横跳；改为鼠标在目标卡上稳定停留120ms才切换，
// 快速扫过/边缘抖动不切换，彻底消除横跳（视觉规则不变，仍用 .card.hovered class 驱动）
let hoverCard=null;        // 当前抽出的卡片
let hoverSwitchT=null;     // 切换确认 timer
let hoverRetractT=null;    // 收回延迟 timer
function setCardHover(card,hover){
  card.classList.toggle('hovered',hover);
  card.style.setProperty('--stack-ry',hover?'0deg':card.dataset.ry);
}
// 兜底判定：按卡片"默认位置"（未抽出时的 translateX/translateY+330下沉）计算矩形，
// 鼠标在牌堆附近时稳定命中 —— 解决卡片 rotateY 侧对投影窄、hover 上移后 elementFromPoint 失准的问题
function pickCardNear(x,y){
  const stack=document.querySelector('.stack');
  if(!stack)return null;
  const sr=stack.getBoundingClientRect();
  const cx=sr.left+sr.width/2;      // 卡片 left:50% 基准
  const bottom=sr.bottom;           // 卡片 bottom:0 基准
  let best=null,bestD=1e9;
  for(const c of document.querySelectorAll('.card')){
    const dx=parseFloat(c.dataset.sx||0);
    const dy=parseFloat(c.dataset.sy||0)+330;      // 默认下沉 330px
    const top=bottom+dy-297;                       // 卡片高约 297
    if(y<top-40||y>bottom+dy+40)continue;          // 垂直范围外跳过（避免横向远处误判）
    const d=Math.hypot(x-(cx+dx+90),y-(top+148));  // 到卡片矩形中心的距离
    if(d<bestD){bestD=d;best=c;}
  }
  return best&&bestD<200?best:null;
}
// hover 卡上升路径保护区：鼠标 x 在该卡水平范围（抽出放大1.15后）且 y 落在
// "默认位置~抽出位置"的竖直带内时，判定保持当前卡不切换——
// 解决"鼠标向上挪点击上升卡片时经过相邻卡判定区导致抽搐"
function isInCardGuard(x,y,card){
  const stack=card.closest('.stack');
  if(!stack)return false;
  const sr=stack.getBoundingClientRect();
  const cx=sr.left+sr.width/2;      // left:50% 基准
  const bottom=sr.bottom;           // bottom:0 基准
  const dx=parseFloat(card.dataset.sx||0);
  const dy=parseFloat(card.dataset.sy||0);
  const defTop=bottom+dy+330-297;   // 默认位置顶部（下沉330，卡片高约297）
  const defBot=bottom+dy+330;       // 默认位置底部
  const liftTop=bottom+dy-50-297;   // 抽出位置顶部（hover上移到-50）
  const liftBot=bottom+dy-50;       // 抽出位置底部
  const yTop=Math.min(defTop,liftTop)-20;
  const yBot=Math.max(defBot,liftBot)+20;
  if(y<yTop||y>yBot)return false;
  const halfW=90*1.15+40;           // 抽出放大1.15后卡片半宽+余量
  const centerX=cx+dx+90;           // 卡片中心（默认+dx）
  return Math.abs(x-centerX)<=halfW;
}
document.addEventListener('mousemove',e=>{
  if(state.app!=='models'||state.viewMode!=='stack'){   // 非模型库/非叠卡视图用原生 :hover，叠卡抽出逻辑不参与
    if(hoverCard){setCardHover(hoverCard,false);hoverCard=null;}
    return;
  }
  const el=document.elementFromPoint(e.clientX,e.clientY);
  let card=el&&el.closest?el.closest('.card'):null;
  if(!card)card=pickCardNear(e.clientX,e.clientY);   // 精确未命中 → 按默认位置兜底
  clearTimeout(hoverRetractT);
  if(!card){   // 鼠标不在任何卡片上：延迟收回
    if(hoverCard){
      const hc=hoverCard;
      hoverRetractT=setTimeout(()=>{if(hoverCard===hc){setCardHover(hc,false);hoverCard=null;}},180);
    }
    return;
  }
  if(card===hoverCard)return;   // 仍在当前卡上：稳定，不动作
  // 上升路径保护区：鼠标在 hover 卡默认位置~抽出位置的竖直带内（水平未移出）→ 保持当前卡不切换，
  // 避免"鼠标向上挪点上升卡片时误切到相邻卡"
  if(hoverCard&&isInCardGuard(e.clientX,e.clientY,hoverCard))return;
  // 目标卡与当前卡不同：120ms 确认后才切换（快速扫过不切换）
  clearTimeout(hoverSwitchT);
  const next=card;
  hoverSwitchT=setTimeout(()=>{
    if(hoverCard&&hoverCard!==next)setCardHover(hoverCard,false);
    hoverCard=next;
    setCardHover(next,true);
  },120);
});

// ---------- 鸿蒙6 光影追踪：光源跟随鼠标的动态高光 ----------
// 节流优化：requestAnimationFrame 每帧只算一次，缓存 cards 列表 + 标志位避免每帧 querySelectorAll，
// rect 缓存按需失效（滚动/渲染时重置），快速拖动不卡顿
function initLightTracking(){
  let cards=null;           // 缓存卡片列表，渲染后失效重建
  let rectCache=null;       // 缓存每卡 rect，滚动/resize 时失效
  let pending=false;        // 是否有 mousemove 待处理
  let lastMx=0,lastMy=0;    // 最近一次鼠标坐标
  function invalidate(){cards=null;rectCache=null;}
  function getCards(){
    if(cards)return cards;
    cards=[...document.querySelectorAll('.card')];
    rectCache=new Array(cards.length).fill(null);
    return cards;
  }
  function apply(){
    pending=false;
    const list=getCards();
    const vh=window.innerHeight,vw=window.innerWidth;
    for(let i=0;i<list.length;i++){
      const el=list[i];
      let r=rectCache[i];
      if(!r){r=el.getBoundingClientRect();rectCache[i]=r;}
      // 视口外卡片光源移到屏外，跳过不必要的样式写入
      if(r.bottom<0||r.top>vh||r.right<0||r.left>vw){
        if(el.style.getPropertyValue('--mx')!=='-9999px'){
          el.style.setProperty('--mx','-9999px');
          el.style.setProperty('--my','-9999px');
        }
        continue;
      }
      el.style.setProperty('--mx',(lastMx-r.left)+'px');
      el.style.setProperty('--my',(lastMy-r.top)+'px');
    }
  }
  document.addEventListener('mousemove',e=>{
    lastMx=e.clientX;lastMy=e.clientY;
    if(pending)return;
    pending=true;
    requestAnimationFrame(apply);
  },{passive:true});
  // 滚动/resize 失效 rect 缓存（卡片位置变了）
  window.addEventListener('scroll',invalidate,{passive:true,capture:true});
  window.addEventListener('resize',invalidate,{passive:true});
  // 暴露失效接口，render 后调用避免用旧卡片列表
  window.__invalidateLightCache=invalidate;
}

// ---------- 鸿蒙6 灵动粒子（按官方 Particle 规范复刻） ----------
// 复刻鸿蒙6 Particle 组件核心：emitter（发射器）+ color/opacity/scale 曲线渐变 + acceleration 向上漂浮
function initParticles(){
  const canvas=document.getElementById('particles');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let W=canvas.width=window.innerWidth;
  let H=canvas.height=window.innerHeight;
  const DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(DPR,DPR);

  // 未来主义配色：绿青系（数据驾驶舱风格）
  const COLORS=[[0,230,118],[0,188,212],[0,230,118]];
  // 发射器：全屏底部矩形发射，每秒约 6 个，生命周期 8s
  const EMIT_RATE=6;          // 每秒发射粒子数
  const LIFETIME=8000;        // 生命周期 ms
  const LIFETIME_RANGE=1200;  // 生命周期随机范围 ms
  const MAX_PARTICLES=120;    // 最大粒子数（性能保护）

  // 鸿蒙6 粒子聚集引力核心：跟随鼠标/交互组件，粒子被引力核心聚集
  let attractors=[{x:-9999,y:-9999,strength:0}];
  window.addEventListener('mousemove',e=>{
    attractors[0]={x:e.clientX,y:e.clientY,strength:1};
  });
  window.addEventListener('mouseout',()=>{attractors[0]={x:-9999,y:-9999,strength:0};});
  // 鼠标点击 → 强引力脉冲（鸿蒙6 按压点光源粒子聚集）
  window.addEventListener('mousedown',e=>{
    attractors.push({x:e.clientX,y:e.clientY,strength:3,decay:0.04});
  });

  let particles=[];
  let lastEmit=performance.now();

  function emit(){
    if(particles.length>=MAX_PARTICLES)return;
    const c=COLORS[Math.floor(Math.random()*COLORS.length)];
    particles.push({
      x:Math.random()*W,
      y:H+10,                       // 底部发射
      vx:(Math.random()-.5)*0.15,
      vy:-0.25-Math.random()*0.15,  // 向上漂浮（angle=90）
      ay:-0.0008,                    // 向上加速度（气态动效）
      r:1.5+Math.random()*2,
      life:0,
      maxLife:LIFETIME+Math.random()*LIFETIME_RANGE,
      color:c,
      // 初始透明度随机（鸿蒙 opacity.range）
      baseAlpha:0.4+Math.random()*0.5
    });
  }

  // 鸿蒙 updater.CURVE：按生命周期阶段返回 0~1 进度
  function curve(progress,start,end){return Math.max(0,Math.min(1,(progress-start)/(end-start)));}

  function loop(now){
    ctx.clearRect(0,0,W,H);
    // 按发射率补发粒子
    const dt=now-lastEmit;
    if(dt>1000/EMIT_RATE){emit();lastEmit=now;}

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life+=dt;
      if(p.life>=p.maxLife){particles.splice(i,1);continue;}
      const prog=p.life/p.maxLife;  // 0~1 生命周期进度

      // 加速度（气态动效：向上加速 + 引力核心聚集）
      p.vy+=p.ay;
      // 鸠蒙6 粒子聚集引力：遍历所有引力核心（鼠标+点击脉冲），粒子被吸引
      for(const a of attractors){
        if(a.strength<=0)continue;
        const dxm=a.x-p.x,dym=a.y-p.y,dm=Math.sqrt(dxm*dxm+dym*dym);
        if(dm<200){
          const pull=(a.strength*0.0008)*(1-dm/200);
          p.vx+=(dxm/dm)*pull;
          p.vy+=(dym/dm)*pull;
        }
      }
      p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);

      // opacity 曲线：0~30% 淡入，60%~100% 淡出（鸿蒙规范）
      let alpha;
      if(prog<0.3)alpha=curve(prog,0,0.3)*p.baseAlpha;
      else if(prog>0.6)alpha=curve(prog,0.6,1)*(1-p.baseAlpha)+p.baseAlpha*(1-curve(prog,0.6,1));
      else alpha=p.baseAlpha;
      alpha=Math.max(0,Math.min(1,alpha));

      // scale 曲线：0~30% 从 0 放大到 1（鸿蒙规范）
      const scale=prog<0.3?curve(prog,0,0.3):1;
      const radius=p.r*scale;

      // color 曲线：按生命周期在绿青系间渐变
      const colorMix=prog;
      const c=p.color;
      // 随生命周期向青色偏移（绿→青渐变）
      const r2=Math.round(c[0]+(78-c[0])*colorMix);
      const g2=Math.round(c[1]+(170-c[1])*colorMix);
      const b2=Math.round(c[2]+(255-c[2])*colorMix);

      // 绘制：带泛光的圆点（鸿蒙 POINT 粒子 + bloom 泛光）
      ctx.beginPath();
      ctx.arc(p.x,p.y,radius,0,Math.PI*2);
      ctx.fillStyle='rgba('+r2+','+g2+','+b2+','+alpha+')';
      ctx.shadowColor='rgba('+r2+','+g2+','+b2+','+(alpha*0.6)+')';
      ctx.shadowBlur=radius*4;
      ctx.fill();
      ctx.shadowBlur=0;
    }
    // 点击脉冲引力衰减清理（避免 attractors 数组无限增长）
    for(let i=attractors.length-1;i>=1;i--){
      const a=attractors[i];
      if(a.decay){a.strength-=a.decay;if(a.strength<=0)attractors.splice(i,1);}
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize',()=>{
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(1,0,0,1,0,0);ctx.scale(DPR,DPR);
  });
  requestAnimationFrame(loop);
}

function initScrollGradientBlur(){
  const content=document.querySelector('.content');
  const topbar=document.querySelector('.topbar');
  if(!content||!topbar)return;
  content.addEventListener('scroll',()=>{
