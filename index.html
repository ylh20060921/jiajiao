// ========== 云端同步（GitHub API） ==========
const CLOUD_REPO='ylh20060921/physics-model-sharing';
const CLOUD_API='https://api.github.com/repos/'+CLOUD_REPO+'/contents/uploads';
const CLOUD_RAW='https://raw.githubusercontent.com/'+CLOUD_REPO+'/main/uploads/';
let cloudModels=[];
let cloudPollTimer=null;
let cloudKnownSHAs=new Set();

// Token 分3段存储，运行时拼接还原
const _tk1='ghp_Za1gBCw3J';
const _tk2='tirvsvjcAifRMz0TX';
const _tk3='fPmA4U8zW1';
function getCloudToken(){return _tk1+_tk2+_tk3;}
function isCloudId(id){return typeof id==='string'&&id.startsWith('cloud_');}
function getCloudModel(id){return cloudModels.find(m=>m.id===id)||null;}



async function fetchCloudModels(){
  try{
    const token=getCloudToken();
    if(!token)return null;
    const resp=await fetch(CLOUD_API,{headers:{Authorization:'Bearer '+token}});
    if(!resp.ok)return null;
    const files=await resp.json();
    if(!Array.isArray(files))return null;
    return files;
  }catch(e){return null;}
}

function buildCloudModels(files){
  return files.filter(function(f){
    const n=f.name.toLowerCase();
    return n.endsWith('.html')||n.endsWith('.htm');
  }).map(function(f){
    return {
      id:'cloud_'+f.sha.substring(0,12),
      filename:f.name,originalName:f.name,
      size:f.size||0,note:'',tags:['云端'],
      title:f.name.replace(/\.(html|htm)$/i,''),thumb:'',fav:false,
      cloud:true,sha:f.sha,
      downloadUrl:CLOUD_RAW+encodeURIComponent(f.name),
      createdAt:f.name.match(/(\d{8,})/)?new Date(parseInt(f.name.match(/(\d{8,})/)[1].substring(0,13))).getTime():null
    };
  });
}

async function uploadToCloud(filename,arrayBuffer){
  const token=getCloudToken();
  if(!token)return false;
  try{
    const bytes=new Uint8Array(arrayBuffer);
    var b64='';
    for(var i=0;i<bytes.length;i+=4096){
      b64+=String.fromCharCode.apply(null,Array.prototype.slice.call(bytes,i,Math.min(i+4096,bytes.length)));
    }
    b64=btoa(b64);
    const resp=await fetch(CLOUD_API+'/'+encodeURIComponent(filename),{
      method:'PUT',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Upload '+filename,content:b64})
    });
    if(resp.ok||resp.status===201){
      const data=await resp.json();
      if(data.content&&data.content.sha)cloudKnownSHAs.add(data.content.sha);
      return true;
    }
    return false;
  }catch(e){console.error('云端上传失败',e);return false;}
}

async function deleteFromCloud(filename,sha){
  const token=getCloudToken();
  if(!token)return false;
  try{
    const resp=await fetch(CLOUD_API+'/'+encodeURIComponent(filename),{
      method:'DELETE',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Delete '+filename,sha:sha})
    });
    return resp.ok;
  }catch(e){return false;}
}

async function rebuildCloudModels(){
  const files=await fetchCloudModels();
  if(files){
    cloudModels=buildCloudModels(files);
    cloudKnownSHAs=new Set(files.map(function(f){return f.sha;}));
  }
}

async function autoPollCloud(){
  const files=await fetchCloudModels();
  if(!files)return;
  const newSHAs=new Set(files.map(function(f){return f.sha;}));
  let hasNew=false;
  newSHAs.forEach(function(k){if(!cloudKnownSHAs.has(k))hasNew=true;});
  if(hasNew&&cloudKnownSHAs.size>0){
    cloudModels=buildCloudModels(files);
    cloudKnownSHAs=newSHAs;
    toast('发现新的云端模型','ok');
    render();
    return;
  }
  cloudKnownSHAs=newSHAs;
}

function initCloudSync(){
  stopCloudPolling();
  rebuildCloudModels().then(function(){render();});
  cloudPollTimer=setInterval(autoPollCloud,30000);
}

function stopCloudPolling(){
  if(cloudPollTimer){clearInterval(cloudPollTimer);cloudPollTimer=null;}
}

// ========== 云端同步 END ========== ---------- 启动 ----------
async function start(){
  try{
    await openDB();
    await backfillThumbs();      // 给老数据补提取缩略图
    await render();
    initParticles();
    initScrollGradientBlur();
    initLightTracking();
    initShortcuts();
    initCloudSync();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="empty"><div class="empty-icon">${IC_WARN}</div><h2>启动失败</h2><p>${escapeHtml(e.message||String(e))}</p><p style="color:var(--muted)">请确认浏览器支持 IndexedDB</p></div>`;
    console.error('启动失败',e);
  }
}
start();
</script>
