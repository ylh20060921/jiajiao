<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静电现象 — 3D交互模型</title>
<style>
:root {
  --bg:#0d1117;--panel-bg:rgba(22,27,34,0.94);--text:#e6edf3;
  --text-dim:#8b949e;--accent-blue:#58a6ff;--accent-red:#f85149;
  --accent-gold:#d2991d;--accent-green:#3fb950;--border:rgba(48,54,61,0.8);--slider-track:#30363d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;user-select:none;color:var(--text)}
#c{position:fixed;inset:0;z-index:0}canvas{display:block}
#top-panel{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;
  background:var(--panel-bg);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:14px;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  box-shadow:0 8px 32px rgba(0,0,0,0.45);
}
#top-panel .item{text-align:center}
#top-panel .item .lbl{font-size:10px;color:var(--text-dim)}
#top-panel .item .val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px}
#top-panel .item .val.gold{color:var(--accent-gold)}
#top-panel .item .val.red{color:var(--accent-red)}
#top-panel .item .val.blue{color:var(--accent-blue)}
#top-panel .item .val.green{color:var(--accent-green)}
#controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:var(--panel-bg);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:14px;padding:12px 20px;box-shadow:0 8px 32px rgba(0,0,0,0.45);
}
button{
  background:var(--slider-track);border:none;color:var(--text-dim);font-size:11px;font-weight:700;
  padding:8px 14px;border-radius:8px;cursor:pointer;transition:all 0.2s;
}
button.active{background:linear-gradient(135deg,var(--accent-gold),#e6a817);color:#0d1117;box-shadow:0 0 12px rgba(210,153,29,0.3)}
.slider-grp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:80px}
.slider-grp label{font-size:10px;font-weight:600;color:var(--text-dim)}
.slider-grp .val{font-size:10px;color:var(--text);font-family:'JetBrains Mono',monospace}
.slider-grp input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;outline:none;cursor:pointer;border:none;background:var(--slider-track)}
.slider-grp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;background:var(--accent-gold);border:2px solid #fff;box-shadow:0 0 12px rgba(210,153,29,0.5)}
#hint{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);z-index:8;font-size:10.5px;color:var(--text-dim);pointer-events:none;opacity:0.5}
</style>
</head>
<body>
<div id="c"></div>
<div id="top-panel">
  <div class="item"><div class="lbl">模式</div><div class="val gold" id="vMode">感应起电</div></div>
  <div class="item"><div class="lbl">导体A电荷</div><div class="val red" id="vQA">0 μC</div></div>
  <div class="item"><div class="lbl">导体B/棒电荷</div><div class="val blue" id="vQB">—</div></div>
  <div class="item"><div class="lbl">总电荷</div><div class="val green" id="vTotal">0 μC</div></div>
</div>
<div id="controls">
  <button data-mode="induction" class="active">感应起电</button>
  <button data-mode="friction">摩擦起电</button>
  <button data-mode="contact">接触起电</button>
  <div class="slider-grp"><label>棒距离/摩擦程度</label><input type="range" id="distSlider" min="0" max="30" value="15"><span class="val" id="distVal">15</span></div>
  <button id="groundBtn">接地(感应)</button>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · R 重置视角</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.setClearColor(0x0d1117);
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1117);
scene.fog=new THREE.Fog(0x0d1117,8,30);
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.5,20);
camera.position.set(0,2,6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*0.75;controls.update();

scene.add(new THREE.AmbientLight(0x404060,1.8));
const key=new THREE.DirectionalLight(0xffffff,4.5);key.position.set(6,8,4);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.near=0.2;key.shadow.camera.far=20;
key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;
key.shadow.bias=-0.00005;key.shadow.normalBias=0.02;scene.add(key);
scene.add(new THREE.DirectionalLight(0x8899cc,1.8).position.set(-3,3,-2));
scene.add(new THREE.DirectionalLight(0xffffff,2.0).position.set(0,2,-4));
scene.add(new THREE.PointLight(0xffffff,2.5,7).position.set(0,4,2));

const root=new THREE.Group();scene.add(root);
const grid=new THREE.PolarGridHelper(4,16,10,48,0x30363d,0x1a1e28);grid.position.y=-1.5;root.add(grid);

const sceneGrp=new THREE.Group();root.add(sceneGrp);
const chargeGrp=new THREE.Group();root.add(chargeGrp);
const labelGrp=new THREE.Group();root.add(labelGrp);

let mode='induction', dist=15, isGrounded=false;

function disposeGroup(grp){
  while(grp.children.length>0){
    const ch=grp.children[0];
    if(ch.geometry)ch.geometry.dispose();
    if(ch.material){if(Array.isArray(ch.material))ch.material.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});else{if(ch.material.map)ch.material.map.dispose();ch.material.dispose();}}
    grp.remove(ch);
  }
}

function addSymbol(grp,x,y,text,color){
  const canvas=document.createElement('canvas');canvas.width=32;canvas.height=32;
  const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.font='bold 20px Inter';ctx.textAlign='center';ctx.fillText(text,16,24);
  const tex=new THREE.CanvasTexture(canvas);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(0.2,0.2,1);sp.position.set(x,y,0);grp.add(sp);return sp;
}

function buildInductionScene(){
  disposeGroup(sceneGrp);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.0,12),new THREE.MeshStandardMaterial({color:0xff4444,roughness:0.2,metalness:0.3,emissive:0x220000,emissiveIntensity:0.6}));
  rod.position.set(-1.5+dist*0.06,0,0);rod.castShadow=true;sceneGrp.add(rod);
  for(let i=0;i<5;i++){
    const stripe=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.04,12),new THREE.MeshBasicMaterial({color:0xff6666}));
    stripe.position.copy(rod.position);stripe.position.x+=i*0.15-0.3;sceneGrp.add(stripe);
  }
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(0.5,32,32),new THREE.MeshStandardMaterial({color:0x888899,roughness:0.15,metalness:0.7}));
  sphere.position.set(0.6,0,0);sphere.castShadow=true;sceneGrp.add(sphere);
  if(isGrounded){
    const wire=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.8,8),new THREE.MeshStandardMaterial({color:0xccaa66,roughness:0.3,metalness:0.9}));
    wire.position.set(0.6,-0.65,0);sceneGrp.add(wire);
    const gndDot=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),new THREE.MeshBasicMaterial({color:0x44ff44}));
    gndDot.position.set(0.6,-1.05,0);sceneGrp.add(gndDot);
  }
}

function buildFrictionScene(){
  disposeGroup(sceneGrp);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.8,0.15),new THREE.MeshStandardMaterial({color:0xaaddff,roughness:0.1,metalness:0.1,opacity:0.7,transparent:true}));
  glass.position.set(-0.3,0,0);glass.castShadow=true;sceneGrp.add(glass);
  const silk=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.7,0.12),new THREE.MeshStandardMaterial({color:0xeeddcc,roughness:0.6,metalness:0.05}));
  silk.position.set(0.3+Math.sin(dist*0.2)*0.15,0,0);silk.castShadow=true;sceneGrp.add(silk);
}

function buildContactScene(){
  disposeGroup(sceneGrp);
  const sphereA=new THREE.Mesh(new THREE.SphereGeometry(0.35,32,32),new THREE.MeshStandardMaterial({color:0xff8866,roughness:0.15,metalness:0.5,emissive:0x220000,emissiveIntensity:0.5}));
  sphereA.position.set(-0.4+dist*0.008,0,0);sphereA.castShadow=true;sceneGrp.add(sphereA);
  const sphereB=new THREE.Mesh(new THREE.SphereGeometry(0.35,32,32),new THREE.MeshStandardMaterial({color:0x8899aa,roughness:0.2,metalness:0.6}));
  sphereB.position.set(0.4,0,0);sphereB.castShadow=true;sceneGrp.add(sphereB);
}

function buildCharges(){
  disposeGroup(chargeGrp);
  if(mode==='induction'){
    const rodX=-1.5+dist*0.06, sphereX=0.6;
    const sep=Math.max(0.01,Math.abs(rodX-sphereX)-0.58);
    const nearCount=Math.min(10,Math.max(0,Math.floor(5+5*(1-Math.min(1,sep/2)))));
    const farCount=10-nearCount;
    for(let i=0;i<nearCount;i++){const y=(i-nearCount/2+0.3)*0.06;addSymbol(chargeGrp,sphereX-0.1-sep*0.04,Math.min(0.38,Math.max(-0.38,y)),'−','#4488ff');}
    for(let i=0;i<farCount;i++){const y=(i-farCount/2+0.3)*0.06;addSymbol(chargeGrp,sphereX+0.1+sep*0.02,Math.min(0.38,Math.max(-0.38,y)),'+','#ff4444');}
    if(isGrounded){for(let i=0;i<farCount;i++){const y=(i-farCount/2)*0.07;addSymbol(chargeGrp,sphereX+0.1,y,'−','#4466cc');}}
  }else if(mode==='friction'){
    for(let i=0;i<8;i++){
      const y=(i-3.5)*0.08;
      addSymbol(chargeGrp,-0.35+Math.random()*0.15,y,'+','#ff4444');
      addSymbol(chargeGrp,0.25+Math.random()*0.15,y,'−','#4488ff');
    }
  }else if(mode==='contact'){
    const cDist=0.8-Math.abs((-0.4+dist*0.008)-0.4);
    const contact=cDist<0.7;
    const qA=contact?5:10, qB=contact?5:0;
    for(let i=0;i<qA;i++){const y=(i-2.5)*0.1;addSymbol(chargeGrp,-0.4+dist*0.008+Math.random()*0.06,y,'+','#ff6666');}
    if(qB>0)for(let i=0;i<qB;i++){const y=(i-2.5)*0.1;addSymbol(chargeGrp,0.4+Math.random()*0.06,y,'+','#ff6644');}
  }
}

function updateUI(){
  document.getElementById('distVal').textContent=dist;
  if(mode==='induction'){
    const sep=Math.max(0.01,Math.abs((-1.5+dist*0.06)-0.6)-0.58);
    const nearCount=Math.min(10,Math.max(0,Math.floor(5+5*(1-Math.min(1,sep/2)))));
    document.getElementById('vQA').textContent=(isGrounded?'净(−)':'净0')+' (近−'+nearCount+')';
    document.getElementById('vQB').textContent='棒 (+) 固定';
    document.getElementById('vTotal').textContent=isGrounded?'净负电荷':'0 μC';
    document.getElementById('groundBtn').style.display='inline-block';
    document.getElementById('distSlider').max=30;document.getElementById('distSlider').value=dist;
  }else if(mode==='friction'){
    const frac=dist/30;
    document.getElementById('vQA').textContent='玻璃(+) '+(frac*10).toFixed(1)+'μC';
    document.getElementById('vQB').textContent='丝绸(−) '+(frac*10).toFixed(1)+'μC';
    document.getElementById('vTotal').textContent='0 μC';
    document.getElementById('groundBtn').style.display='none';
    document.getElementById('distSlider').max=30;
  }else if(mode==='contact'){
    const cDist=0.8-Math.abs((-0.4+dist*0.008)-0.4);
    const contact=cDist<0.7;
    document.getElementById('vQA').textContent='球A '+(contact?'5':'10')+' μC';
    document.getElementById('vQB').textContent='球B '+(contact?'5':'0')+' μC';
    document.getElementById('vTotal').textContent='10 μC';
    document.getElementById('groundBtn').style.display='none';
    document.getElementById('distSlider').max=25;
  }
}

function fullRebuild(){
  if(mode==='induction')buildInductionScene();
  else if(mode==='friction')buildFrictionScene();
  else buildContactScene();
  buildCharges();updateUI();
}

document.querySelectorAll('button[data-mode]').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');mode=this.dataset.mode;dist=mode==='induction'?15:0;isGrounded=false;
    document.getElementById('distSlider').value=dist;fullRebuild();
  });
});
document.getElementById('distSlider').addEventListener('input',function(){dist=parseInt(this.value);fullRebuild();});
document.getElementById('groundBtn').addEventListener('click',function(){isGrounded=!isGrounded;this.textContent=isGrounded?'断开接地':'接地(感应)';fullRebuild();});

window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){camera.position.set(0,2,6);controls.target.set(0,0,0);controls.update();}});
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
fullRebuild();requestAnimationFrame(animate);
</script>
</html>
