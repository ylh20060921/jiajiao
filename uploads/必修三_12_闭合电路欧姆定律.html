<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闭合电路欧姆定律 E=U+Ir — 3D交互模型</title>
<style>
:root {
  --bg:#0d1117;--panel-bg:rgba(22,27,34,0.94);--text:#e6edf3;
  --text-dim:#8b949e;--accent-blue:#58a6ff;--accent-red:#f85149;
  --accent-gold:#d2991d;--accent-green:#3fb950;--accent-purple:#bc8cff;
  --accent-orange:#ff8c42;--border:rgba(48,54,61,0.8);--slider-track:#30363d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;user-select:none;color:var(--text)}
#c{position:fixed;inset:0;z-index:0}canvas{display:block}

#top-panel{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;
  background:var(--panel-bg);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid var(--border);border-radius:14px;padding:10px 20px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  box-shadow:0 8px 32px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.03);
}
#top-panel .item{text-align:center}
#top-panel .item .lbl{font-size:10px;color:var(--text-dim);letter-spacing:0.3px}
#top-panel .item .val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px}
#top-panel .item .val.gold{color:var(--accent-gold)}
#top-panel .item .val.green{color:var(--accent-green)}
#top-panel .item .val.red{color:var(--accent-red)}
#top-panel .item .val.blue{color:var(--accent-blue)}
#top-panel .item .val.purple{color:var(--accent-purple)}
#top-panel .item .bar-wrap{width:55px;height:6px;background:var(--slider-track);border-radius:3px;margin-top:3px;overflow:hidden}
#top-panel .item .bar-fill{height:100%;border-radius:3px;transition:width 0.15s}
#top-panel .item .bar-fill.u{background:var(--accent-green)}
#top-panel .item .bar-fill.ui{background:var(--accent-red)}
#top-panel .item .bar-fill.e{background:var(--accent-gold)}

#controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:var(--panel-bg);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid var(--border);border-radius:14px;padding:12px 20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.03);
}
.slider-grp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:80px}
.slider-grp label{font-size:10px;font-weight:600;color:var(--text-dim)}
.slider-grp .val{font-size:10px;color:var(--text);font-family:'JetBrains Mono',monospace}
.slider-grp input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:3px;outline:none;cursor:pointer;border:none;background:var(--slider-track)
}
.slider-grp input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;
  background:var(--accent-gold);border:2px solid #fff;box-shadow:0 0 12px rgba(210,153,29,0.5)
}
#hint{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);z-index:8;font-size:10.5px;color:var(--text-dim);pointer-events:none;opacity:0.5}
#formula-label{
  position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:9;
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
  color:var(--accent-gold);text-shadow:0 0 20px rgba(210,153,29,0.4);pointer-events:none;
}
@media(max-width:900px){#top-panel{gap:8px;padding:8px 10px}#top-panel .item .val{font-size:12px}#controls{gap:8px;padding:8px 12px}}
</style>
</head>
<body>
<div id="c"></div>
<div id="formula-label">I = E / (R + r) &nbsp;&nbsp; U = E − Ir</div>
<div id="top-panel">
  <div class="item"><div class="lbl">电动势 E</div><div class="val gold" id="vE">6.0 V</div>
    <div class="bar-wrap"><div class="bar-fill e" id="barE" style="width:60%"></div></div>
  </div>
  <div class="item"><div class="lbl">电流 I</div><div class="val blue" id="vI">1.00 A</div></div>
  <div class="item"><div class="lbl">路端电压 U</div><div class="val green" id="vU">5.0 V</div>
    <div class="bar-wrap"><div class="bar-fill u" id="barU" style="width:50%"></div></div>
  </div>
  <div class="item"><div class="lbl">内电压 U内</div><div class="val red" id="vUi">1.0 V</div>
    <div class="bar-wrap"><div class="bar-fill ui" id="barUi" style="width:10%"></div></div>
  </div>
  <div class="item"><div class="lbl">输出功率</div><div class="val purple" id="vPout">5.0 W</div></div>
</div>
<div id="controls">
  <div class="slider-grp"><label>E (V)</label><input type="range" id="eSlider" min="1" max="12" value="6" step="0.1"><span class="val" id="eVal">6.0</span></div>
  <div class="slider-grp"><label>外阻 R (Ω)</label><input type="range" id="rSlider" min="0.5" max="20" value="5" step="0.1"><span class="val" id="rVal">5.0</span></div>
  <div class="slider-grp"><label>内阻 r (Ω)</label><input type="range" id="riSlider" min="0.2" max="5" value="1" step="0.1"><span class="val" id="riVal">1.0</span></div>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · R 重置视角</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.setClearColor(0x0d1117);
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1117);
scene.fog=new THREE.Fog(0x0d1117,8,30);

const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.5,20);
camera.position.set(2,2.5,6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=14;
controls.maxPolarAngle=Math.PI*0.75;
controls.update();

scene.add(new THREE.AmbientLight(0x404060,1.8));
const key=new THREE.DirectionalLight(0xffffff,4.5);
key.position.set(8,10,5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=0.2;key.shadow.camera.far=30;
key.shadow.camera.left=-8;key.shadow.camera.right=8;
key.shadow.camera.top=8;key.shadow.camera.bottom=-8;
key.shadow.bias=-0.00005;key.shadow.normalBias=0.02;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x8899cc,1.8).position.set(-3,3,-2));
scene.add(new THREE.DirectionalLight(0xffffff,2.0).position.set(0,2,-4));
scene.add(new THREE.PointLight(0xffffff,3,8).position.set(0,4,2));

const root=new THREE.Group();scene.add(root);
const grid=new THREE.PolarGridHelper(4,20,12,64,0x30363d,0x1a1e28);
grid.position.y=-1.8;root.add(grid);

const battGrp=new THREE.Group();root.add(battGrp);
const rExtGrp=new THREE.Group();root.add(rExtGrp);
const wireGrp=new THREE.Group();root.add(wireGrp);
const particleGrp=new THREE.Group();root.add(particleGrp);
const labelGrp=new THREE.Group();root.add(labelGrp);
const intGlowLight=new THREE.PointLight(0xff4422,1,2);

let E=6,R=5,ri=1;
const nParticles=50;

function disposeGroup(grp){
  while(grp.children.length>0){
    const ch=grp.children[0];
    if(ch.geometry)ch.geometry.dispose();
    if(ch.material){
      if(Array.isArray(ch.material))ch.material.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});
      else{if(ch.material.map)ch.material.map.dispose();ch.material.dispose();}
    }
    grp.remove(ch);
  }
}

function buildBattery(){
  disposeGroup(battGrp);
  const bodyGeom=new THREE.CylinderGeometry(0.25,0.25,1.8,16);
  const bodyMat=new THREE.MeshStandardMaterial({color:0x556688,roughness:0.3,metalness:0.6});
  const body=new THREE.Mesh(bodyGeom,bodyMat);body.position.set(-1.8,0,0);body.castShadow=true;
  body.quaternion.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2);
  battGrp.add(body);
  const capGeom=new THREE.CylinderGeometry(0.23,0.23,0.15,16);
  const posCap=new THREE.Mesh(capGeom,new THREE.MeshStandardMaterial({color:0xff4444,roughness:0.2,metalness:0.7,emissive:0x220000,emissiveIntensity:0.8}));
  posCap.position.set(-0.85,0,0);posCap.quaternion.copy(body.quaternion);battGrp.add(posCap);
  const negCap=new THREE.Mesh(capGeom,new THREE.MeshStandardMaterial({color:0x4488ff,roughness:0.2,metalness:0.7,emissive:0x000022,emissiveIntensity:0.8}));
  negCap.position.set(-2.75,0,0);negCap.quaternion.copy(body.quaternion);battGrp.add(negCap);
  const intGeom=new THREE.CylinderGeometry(0.08,0.08,0.8,8);
  const intMat=new THREE.MeshStandardMaterial({color:0xcc6644,roughness:0.5,metalness:0.1,emissive:0x220000,emissiveIntensity:0.3});
  const intR=new THREE.Mesh(intGeom,intMat);
  intR.position.set(-1.8,0.45,0);intR.quaternion.copy(body.quaternion);intR.castShadow=true;
  battGrp.add(intR);
  battGrp.add(intGlowLight);
  intGlowLight.position.set(-1.8,0.45,0);
}

function buildRExt(){
  disposeGroup(rExtGrp);
  const bodyGeom=new THREE.CylinderGeometry(0.2,0.2,1.2,16);
  const bodyMat=new THREE.MeshStandardMaterial({color:0xcc8844,roughness:0.5,metalness:0.1,emissive:0x080400,emissiveIntensity:0.3});
  const body=new THREE.Mesh(bodyGeom,bodyMat);body.position.set(1.8,0,0);body.castShadow=true;
  body.quaternion.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2);
  rExtGrp.add(body);
  for(let i=-2;i<=2;i++){
    const stripe=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.06,12),
      new THREE.MeshStandardMaterial({color:0x553311,roughness:0.5,metalness:0.1}));
    stripe.position.set(1.8,i*0.22,0);stripe.quaternion.copy(body.quaternion);rExtGrp.add(stripe);
  }
}

function buildWires(){
  disposeGroup(wireGrp);
  const mat=new THREE.MeshStandardMaterial({color:0xcca866,roughness:0.3,metalness:0.9});
  const r=0.04;
  const makeWire=(x1,y1,z1,x2,y2,z2)=>{
    const dx=x2-x1,dy=y2-y1,dz=z2-z1;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    const geom=new THREE.CylinderGeometry(r,r,len,8);
    const mesh=new THREE.Mesh(geom,mat);mesh.castShadow=true;
    mesh.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
    return mesh;
  };
  wireGrp.add(makeWire(-1.8,0,0, -1.8,-0.5,0));
  wireGrp.add(makeWire(-1.8,-0.5,0, 1.8,-0.5,0));
  wireGrp.add(makeWire(1.8,-0.5,0, 1.8,0,0));
  wireGrp.add(makeWire(-1.8,0,0, -1.8,0.45,0));
  wireGrp.add(makeWire(-1.8,0.45,0, -1.8,0.9,0));
  wireGrp.add(makeWire(-1.8,0.9,0, 1.8,0.9,0));
  wireGrp.add(makeWire(1.8,0.9,0, 1.8,0,0));
}

function buildLabels(){
  disposeGroup(labelGrp);
  const makeLabel=(text,x,y,color,w=0.7)=>{
    const canvas=document.createElement('canvas');
    canvas.width=128;canvas.height=36;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle=color;ctx.font='bold 18px Inter,Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText(text,64,26);
    const tex=new THREE.CanvasTexture(canvas);tex.minFilter=THREE.LinearFilter;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    sp.scale.set(w,0.22,1);sp.position.set(x,y,0.3);
    return sp;
  };
  labelGrp.add(makeLabel('E, r',-1.8,0.55,'#ffcc88'));
  labelGrp.add(makeLabel('R',1.8,0.5,'#ffcc88'));
  labelGrp.add(makeLabel('+',-0.85,0.4,'#ff6666',0.3));
  labelGrp.add(makeLabel('−',-2.75,0.4,'#6688ff',0.3));
}

const particles=[];
const pGeom=new THREE.SphereGeometry(0.035,5,5);
const pMat=new THREE.MeshStandardMaterial({color:0x44ddff,roughness:0.1,metalness:0.3,emissive:0x003344,emissiveIntensity:1.8});

function getParticlePos(arc){
  const totalLen=10.0;
  const segLen=[0.9,3.6,0.9,0.5,3.6,0.5];
  let d=((arc/(Math.PI*2))%1)*totalLen;
  function seg(i){return segLen.slice(0,i).reduce((a,b)=>a+b,0);}
  let x,y;
  if(d<seg(1)){const t=(d-seg(0))/segLen[0];x=1.8;y=0+(0.9-0)*t;}
  else if(d<seg(2)){const t=(d-seg(1))/segLen[1];x=1.8-t*3.6;y=0.9;}
  else if(d<seg(3)){const t=(d-seg(2))/segLen[2];x=-1.8;y=0.9-t*0.9;}
  else if(d<seg(4)){const t=(d-seg(3))/segLen[3];x=-1.8;y=0-t*0.5;}
  else if(d<seg(5)){const t=(d-seg(4))/segLen[4];x=-1.8+t*3.6;y=-0.5;}
  else{const t=(d-seg(5))/segLen[5];x=1.8;y=-0.5+t*0.5;}
  return {x,y};
}

function spawnParticles(){
  disposeGroup(particleGrp);
  particles.length=0;
  for(let i=0;i<nParticles;i++){
    const mesh=new THREE.Mesh(pGeom,pMat);
    mesh.userData={arc:Math.random()*Math.PI*2,speed:0.5+Math.random()*0.5};
    particleGrp.add(mesh);
    particles.push(mesh);
  }
}

function updateParticles(dt){
  const I=E/Math.max(R+ri,0.01);
  const speed=I*4;
  for(const p of particles){
    p.userData.arc+=dt*0.5*speed*p.userData.speed;
    const pos=getParticlePos(p.userData.arc);
    p.position.set(pos.x,pos.y,0);
  }
}

function updateUI(){
  const I=E/Math.max(R+ri,0.01);
  const U=E-I*ri;
  const Ui=I*ri;
  const Pout=U*I;
  document.getElementById('vE').textContent=E.toFixed(1)+' V';
  document.getElementById('vI').textContent=I.toFixed(2)+' A';
  document.getElementById('vU').textContent=U.toFixed(1)+' V';
  document.getElementById('vUi').textContent=Ui.toFixed(1)+' V';
  document.getElementById('vPout').textContent=Pout.toFixed(1)+' W';
  document.getElementById('barE').style.width=Math.min(100,(E/12)*100).toFixed(0)+'%';
  document.getElementById('barU').style.width=Math.min(100,(U/E)*100).toFixed(0)+'%';
  document.getElementById('barUi').style.width=Math.min(100,(Ui/E)*100).toFixed(0)+'%';
  document.getElementById('eVal').textContent=E.toFixed(1);
  document.getElementById('rVal').textContent=R.toFixed(1);
  document.getElementById('riVal').textContent=ri.toFixed(1);
  const intHeat=Ui*I;
  intGlowLight.intensity=Math.min(3,intHeat*0.5+0.2);
  intGlowLight.color=new THREE.Color().setHSL(0.08,0.9,0.2+Math.min(0.6,intHeat*0.15));
}

function fullRebuild(){
  buildBattery();
  buildRExt();
  buildWires();
  buildLabels();
  spawnParticles();
  updateUI();
}

document.getElementById('eSlider').addEventListener('input',function(){E=parseFloat(this.value);});
document.getElementById('rSlider').addEventListener('input',function(){R=parseFloat(this.value);});
document.getElementById('riSlider').addEventListener('input',function(){ri=parseFloat(this.value);});

window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){camera.position.set(2,2.5,6);controls.target.set(0,0,0);controls.update();}});
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  controls.update();
  updateParticles(dt);
  updateUI();
  renderer.render(scene,camera);
}
fullRebuild();
requestAnimationFrame(animate);
</script>
</html>
