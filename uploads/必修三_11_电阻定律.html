<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电阻定律 R=ρL/S — 3D交互模型</title>
<style>
:root {
  --bg:#0d1117;--panel-bg:rgba(22,27,34,0.94);--text:#e6edf3;
  --text-dim:#8b949e;--accent-blue:#58a6ff;--accent-red:#f85149;
  --accent-gold:#d2991d;--accent-green:#3fb950;--border:rgba(48,54,61,0.8);
  --slider-track:#30363d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;user-select:none;color:var(--text)}
#c{position:fixed;inset:0;z-index:0}canvas{display:block}

#top-panel{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;
  background:var(--panel-bg);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid var(--border);border-radius:14px;padding:10px 22px;
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  box-shadow:0 8px 32px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.03);
}
#top-panel .item{text-align:center}
#top-panel .item .lbl{font-size:10.5px;color:var(--text-dim);letter-spacing:0.4px}
#top-panel .item .val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px}
#top-panel .item .val.gold{color:var(--accent-gold)}
#top-panel .item .val.blue{color:var(--accent-blue)}
#top-panel .item .val.green{color:var(--accent-green)}
#top-panel .item .val.red{color:var(--accent-red)}
#top-panel .item .bar-wrap{width:60px;height:6px;background:var(--slider-track);border-radius:3px;margin-top:3px;overflow:hidden}
#top-panel .item .bar-fill{height:100%;border-radius:3px;transition:width 0.15s}
#top-panel .item .bar-fill.r{background:var(--accent-red)}
#top-panel .item .bar-fill.i{background:var(--accent-green)}

#controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:var(--panel-bg);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid var(--border);border-radius:14px;padding:12px 20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.03);
}
.mat-btn{font-size:11px;font-weight:600;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.2s}
.mat-btn.active{color:var(--accent-gold);border-color:var(--accent-gold);background:rgba(210,153,29,0.1);box-shadow:0 0 12px rgba(210,153,29,0.2)}
.slider-grp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px}
.slider-grp label{font-size:10px;font-weight:600;color:var(--text-dim)}
.slider-grp .val{font-size:10px;color:var(--text);font-family:'JetBrains Mono',monospace}
.slider-grp input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:3px;outline:none;cursor:pointer;border:none;background:var(--slider-track)
}
.slider-grp input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;
  background:var(--accent-gold);border:2px solid #fff;box-shadow:0 0 12px rgba(210,153,29,0.5)
}
#hint{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);z-index:8;font-size:10.5px;color:var(--text-dim);pointer-events:none;opacity:0.5}
#formula-label{
  position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:9;
  font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;
  color:var(--accent-gold);text-shadow:0 0 20px rgba(210,153,29,0.4);pointer-events:none;
}
@media(max-width:900px){#top-panel{gap:10px;padding:8px 12px}#top-panel .item .val{font-size:12px}#controls{gap:8px;padding:8px 12px}}
</style>
</head>
<body>
<div id="c"></div>
<div id="formula-label">R = ρ · L / S</div>
<div id="top-panel">
  <div class="item"><div class="lbl">电阻率 ρ</div><div class="val gold" id="vRho">1.7×10⁻⁸</div></div>
  <div class="item"><div class="lbl">电阻 R</div><div class="val red" id="vR">0.017 Ω</div>
    <div class="bar-wrap"><div class="bar-fill r" id="barR" style="width:50%"></div></div>
  </div>
  <div class="item"><div class="lbl">电流 I</div><div class="val green" id="vI">58.8 A</div>
    <div class="bar-wrap"><div class="bar-fill i" id="barI" style="width:50%"></div></div>
  </div>
  <div class="item"><div class="lbl">截面积 S</div><div class="val blue" id="vS">5.0 mm²</div></div>
  <div class="item"><div class="lbl">长度 L</div><div class="val blue" id="vL">5.0 m</div></div>
</div>
<div id="controls">
  <button class="mat-btn active" data-mat="cu">铜 Cu</button>
  <button class="mat-btn" data-mat="al">铝 Al</button>
  <button class="mat-btn" data-mat="fe">铁 Fe</button>
  <button class="mat-btn" data-mat="ni">镍铬 NiCr</button>
  <div class="slider-grp"><label>长度 L (m)</label><input type="range" id="lSlider" min="1" max="10" value="5" step="0.1"><span class="val" id="lVal">5.0</span></div>
  <div class="slider-grp"><label>面积 S (mm²)</label><input type="range" id="sSlider" min="0.5" max="10" value="5" step="0.1"><span class="val" id="sVal">5.0</span></div>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · R 重置视角</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.setClearColor(0x0d1117);
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1117);
scene.fog=new THREE.Fog(0x0d1117,8,30);

const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.5,25);
camera.position.set(1,2.5,7);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=16;
controls.maxPolarAngle=Math.PI*0.75;
controls.update();

scene.add(new THREE.AmbientLight(0x404060,1.8));
const key=new THREE.DirectionalLight(0xffffff,4.5);
key.position.set(8,10,5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=0.2;key.shadow.camera.far=30;
key.shadow.camera.left=-10;key.shadow.camera.right=10;
key.shadow.camera.top=10;key.shadow.camera.bottom=-10;
key.shadow.bias=-0.00005;key.shadow.normalBias=0.02;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x8899cc,1.8).position.set(-3,3,-2));
scene.add(new THREE.DirectionalLight(0xffffff,2.0).position.set(0,2,-5));
scene.add(new THREE.PointLight(0xffffff,3,8).position.set(0,4,2));

const root=new THREE.Group();scene.add(root);
const grid=new THREE.PolarGridHelper(4,20,12,64,0x30363d,0x1a1e28);
grid.position.y=-2.8;root.add(grid);

const wireGrp=new THREE.Group();root.add(wireGrp);
const electrodeGrp=new THREE.Group();root.add(electrodeGrp);
const particleGrp=new THREE.Group();root.add(particleGrp);
const fieldGrp=new THREE.Group();root.add(fieldGrp);
const labelGrp=new THREE.Group();root.add(labelGrp);

const materials={
  cu:{rho:1.7e-8,name:'铜 Cu',color:0xcc8855,emissive:0x110800},
  al:{rho:2.8e-8,name:'铝 Al',color:0xbbbbcc,emissive:0x080808},
  fe:{rho:10e-8,name:'铁 Fe',color:0x8899aa,emissive:0x060808},
  ni:{rho:100e-8,name:'镍铬 NiCr',color:0x998899,emissive:0x080608}
};
let curMat='cu';
let L=5,S=5;
const Uconst=1;
const nParticles=80;

function disposeGroup(grp){
  while(grp.children.length>0){
    const ch=grp.children[0];
    if(ch.geometry)ch.geometry.dispose();
    if(ch.material){
      if(Array.isArray(ch.material))ch.material.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});
      else{if(ch.material.map)ch.material.map.dispose();ch.material.dispose();}
    }
    grp.remove(ch);
  }
}

let rho,R,I,visualLen,visualR,flowSpeed;

function recompute(){
  const L_scale=0.7;
  const S_scale=0.4;
  visualLen=L*L_scale;
  visualR=Math.sqrt(S/Math.PI)*S_scale*3;
  rho=materials[curMat].rho;
  R=rho*L/(S*1e-6);
  I=Uconst/Math.max(R,1e-12);
  flowSpeed=Math.min(3,1/(Math.max(R,0.001)*3));
}

function buildWire(){
  disposeGroup(wireGrp);
  const len=visualLen,rad=visualR;
  const capGeom=new THREE.CylinderGeometry(rad,rad,len,32,1,false);
  const mat=new THREE.MeshStandardMaterial({
    color:materials[curMat].color,roughness:0.35,metalness:0.8,
    emissive:materials[curMat].emissive,emissiveIntensity:0.5
  });
  const wire=new THREE.Mesh(capGeom,mat);
  wire.quaternion.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2);
  wire.castShadow=true;
  wireGrp.add(wire);

  const glowGeom=new THREE.CylinderGeometry(rad+0.04,rad+0.04,len,16,1,true);
  const glowMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.08,depthWrite:false});
  const glow=new THREE.Mesh(glowGeom,glowMat);
  glow.quaternion.copy(wire.quaternion);
  wireGrp.add(glow);
}

function buildElectrodes(){
  disposeGroup(electrodeGrp);
  const halfLen=visualLen/2;
  const rad=visualR;
  const endGeom=new THREE.CylinderGeometry(rad+0.15,rad+0.15,0.25,16);
  const posMat=new THREE.MeshStandardMaterial({color:0xff4444,roughness:0.2,metalness:0.7,emissive:0x220000,emissiveIntensity:0.8});
  const negMat=new THREE.MeshStandardMaterial({color:0x4488ff,roughness:0.2,metalness:0.7,emissive:0x000022,emissiveIntensity:0.8});
  const posE=new THREE.Mesh(endGeom,posMat);
  posE.quaternion.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2);
  posE.position.set(halfLen+0.15,0,0);
  posE.castShadow=true;
  electrodeGrp.add(posE);
  const negE=new THREE.Mesh(endGeom,negMat);
  negE.quaternion.copy(posE.quaternion);
  negE.position.set(-halfLen-0.15,0,0);
  negE.castShadow=true;
  electrodeGrp.add(negE);

  const ringGeom=new THREE.TorusGeometry(rad+0.2,0.03,8,24);
  const pRing=new THREE.Mesh(ringGeom,new THREE.MeshBasicMaterial({color:0xff8888,transparent:true,opacity:0.35,depthWrite:false}));
  pRing.position.copy(posE.position);
  pRing.quaternion.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);
  electrodeGrp.add(pRing);
  const nRing=new THREE.Mesh(ringGeom,new THREE.MeshBasicMaterial({color:0x8888ff,transparent:true,opacity:0.35,depthWrite:false}));
  nRing.position.copy(negE.position);
  nRing.quaternion.copy(pRing.quaternion);
  electrodeGrp.add(nRing);
}

function buildLabels(){
  disposeGroup(labelGrp);
  const halfLen=visualLen/2;
  const makeLabel=(text,x,color)=>{
    const canvas=document.createElement('canvas');
    canvas.width=128;canvas.height=48;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle=color;ctx.font='bold 22px Inter,Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText(text,64,30);
    const tex=new THREE.CanvasTexture(canvas);tex.minFilter=THREE.LinearFilter;
    const spMat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false});
    const sp=new THREE.Sprite(spMat);sp.scale.set(1.2,0.45,1);sp.position.set(x,visualR+0.5,0);
    return sp;
  };
  labelGrp.add(makeLabel('+',halfLen+0.25,'#ff6666'));
  labelGrp.add(makeLabel('−',-halfLen-0.25,'#6688ff'));
}

function buildField(){
  disposeGroup(fieldGrp);
  const halfLen=visualLen/2;
  const rad=visualR;
  const nX=Math.max(4,Math.floor(visualLen/0.5));
  const nAng=6;
  const arrowGeom=new THREE.ConeGeometry(0.05,0.16,5);
  const arrowMat=new THREE.MeshStandardMaterial({color:0xffcc66,roughness:0.25,metalness:0.05,emissive:0x221100,emissiveIntensity:0.5});
  for(let ix=0;ix<nX;ix++){
    const x_rel=-halfLen+0.2+(visualLen-0.4)*(ix+0.5)/nX;
    for(let ia=0;ia<nAng;ia++){
      const ang=ia/nAng*Math.PI*2;
      const y=Math.cos(ang)*(rad+0.3);
      const z=Math.sin(ang)*(rad+0.3);
      const arr=new THREE.Mesh(arrowGeom,arrowMat);
      arr.position.set(x_rel,y,z);
      arr.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(1,0,0));
      fieldGrp.add(arr);
    }
  }
}

const particles=[];
const pGeom=new THREE.SphereGeometry(0.04,6,6);
function spawnParticles(){
  disposeGroup(particleGrp);
  particles.length=0;
  const halfLen=visualLen/2;
  const pMat=new THREE.MeshStandardMaterial({color:0x44ddff,roughness:0.1,metalness:0.3,emissive:0x003344,emissiveIntensity:1.8});
  for(let i=0;i<nParticles;i++){
    const mesh=new THREE.Mesh(pGeom,pMat);
    const t=Math.random();
    mesh.position.set(-halfLen+t*visualLen,(Math.random()-0.5)*visualR*1.6,(Math.random()-0.5)*visualR*1.6);
    mesh.userData={phase:Math.random()*6.283,t:Math.random(),speed:0.5+Math.random()*0.5};
    particleGrp.add(mesh);
    particles.push(mesh);
  }
}

function updateParticles(dt){
  const halfLen=visualLen/2;
  const rad=visualR;
  for(const p of particles){
    p.userData.phase+=dt*flowSpeed*p.userData.speed;
    const t=p.userData.phase%1;
    p.position.x=-halfLen+t*visualLen;
    p.position.y+=(Math.sin(p.userData.phase*11+0.3)-p.position.y/rad)*dt*2;
    p.position.z+=(Math.cos(p.userData.phase*13+0.7)-p.position.z/rad)*dt*2;
    const r=Math.sqrt(p.position.y*p.position.y+p.position.z*p.position.z);
    if(r>rad*0.9){const s=rad*0.9/r;p.position.y*=s;p.position.z*=s;}
  }
}

function updateUI(){
  document.getElementById('vRho').textContent=rho<1e-6? (rho*1e8).toFixed(1)+'×10⁻⁸': rho.toExponential(1);
  let rStr;
  if(R>=0.1)rStr=R.toFixed(2)+' Ω';
  else if(R>=0.001)rStr=(R*1000).toFixed(1)+' mΩ';
  else rStr=(R*1e6).toFixed(1)+' μΩ';
  document.getElementById('vR').textContent=rStr;
  document.getElementById('vI').textContent=I.toFixed(2)+' A';
  const rMax=Math.max(0.01,materials.ni.rho*10/(0.5e-6));
  const rPct=Math.min(100,(R/rMax)*100);
  document.getElementById('barR').style.width=rPct.toFixed(0)+'%';
  const iMax=Uconst/Math.max(1e-12,materials.cu.rho*1/(10e-6));
  const iPct=Math.min(100,(I/iMax)*100);
  document.getElementById('barI').style.width=iPct.toFixed(0)+'%';
  document.getElementById('vS').textContent=S.toFixed(1)+' mm²';
  document.getElementById('vL').textContent=L.toFixed(1)+' m';
  document.getElementById('lVal').textContent=L.toFixed(1);
  document.getElementById('sVal').textContent=S.toFixed(1);
}

function fullRebuild(){
  recompute();
  buildWire();
  buildElectrodes();
  buildLabels();
  buildField();
  spawnParticles();
  updateUI();
}

document.querySelectorAll('.mat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    curMat=btn.dataset.mat;
    fullRebuild();
  });
});
document.getElementById('lSlider').addEventListener('input',function(){L=parseFloat(this.value);fullRebuild();});
document.getElementById('sSlider').addEventListener('input',function(){S=parseFloat(this.value);fullRebuild();});

window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){camera.position.set(1,2.5,7);controls.target.set(0,0,0);controls.update();}});
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  controls.update();
  updateParticles(dt);
  renderer.render(scene,camera);
}
fullRebuild();
requestAnimationFrame(animate);
</script>
</html>
